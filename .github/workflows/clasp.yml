name: Deploy to Google Apps Script

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Clasp
        # 버전 고정 필수: clasp 3.x는 .clasprc.json 인증 파일 처리와 CLI 동작이
        # 달라져 CLASPRC_JSON 시크릿(v2 형식)과 호환되지 않는다.
        # 로컬 devDependency(^2.4.2)와 동일 계열로 유지할 것.
        run: npm install -g @google/clasp@2.5.0

      - name: Create ~/.clasprc.json
        run: |
          echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json

      - name: Push to Google Apps Script
        run: clasp push --force

      # `clasp push`는 스크립트의 HEAD 코드만 갱신한다. 웹앱 URL은 **버전 배포**에 고정돼 있으므로
      # deploy로 새 버전을 만들어 같은 URL이 그 버전을 가리키게 해야 실사용자에게 반영된다.
      # 이 단계가 없던 동안 push만으로는 배포 URL이 동결된 채였다(같은 현상을 DEV @2/@3에서 실제로 겪음).
      #
      # ⚠️ `-i`로 배포 ID를 반드시 고정할 것. 생략하면 실행할 때마다 **새 URL이 생성**되어
      #    배포가 무한 증식한다(과거 Production에 배포가 17개까지 쌓인 원인).
      - name: Deploy to Production web app
        run: clasp deploy -i AKfycbyjoryKydzwRJoLzzgzgcgmLZYASjTjWyl8fidtJhXikudFnlqCb1-4j-zPdlwRZ7Y9hA -d "main ${{ github.sha }}"
