name: Deploy to Google Apps Script

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Clasp
        # CLASPRC_JSON 시크릿은 clasp **3.x** 형식(`tokens.default`, `token` 키 없음)이다.
        # run #44까지 비고정(3.x) 설치로 성공하다가 run #45에서 2.5.0으로 고정한 뒤 6회 연속
        # "Error retrieving access token: Cannot read properties of undefined (reading 'access_token')"로
        # 실패했다 — 2.x는 `token.access_token`을 찾는다. 시크릿이 아니라 버전이 문제였다.
        # 3.x 안에서 고정하는 이유: 플래그(push --force / deploy -i -d)를 확인한 버전을 못 박아 두기 위함.
        # 로컬 devDependency(2.x)와 계열이 다르지만 로컬은 DEV 푸시 전용이라 서로 영향이 없다.
        run: npm install -g @google/clasp@3.4.1

      - name: Create ~/.clasprc.json
        run: |
          echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json

      # 실패 시 원인을 로그에서 바로 알 수 있게 인증 파일의 **키 이름만** 찍는다 (값은 절대 출력하지 않는다).
      # 3.x 형식이면 "tokens", 2.x 형식이면 "token,oauth2ClientSettings,isLocalCreds"가 보인다.
      - name: Check credential file shape
        run: |
          node -e 'const j=JSON.parse(require("fs").readFileSync(process.env.HOME+"/.clasprc.json","utf8")); console.log("clasprc keys:", Object.keys(j).join(","), j.tokens ? "/ tokens:" + Object.keys(j.tokens).join(",") : "");'

      - name: Push to Google Apps Script
        run: clasp push --force

      # `clasp push`는 스크립트의 HEAD 코드만 갱신한다. 웹앱 URL은 **버전 배포**에 고정돼 있으므로
      # deploy로 새 버전을 만들어 같은 URL이 그 버전을 가리키게 해야 실사용자에게 반영된다.
      # 이 단계가 없던 동안 push만으로는 배포 URL이 동결된 채였다(같은 현상을 DEV @2/@3에서 실제로 겪음).
      #
      # ⚠️ `-i`로 배포 ID를 반드시 고정할 것. 생략하면 실행할 때마다 **새 URL이 생성**되어
      #    배포가 무한 증식한다(과거 Production에 배포가 17개까지 쌓인 원인).
      - name: Deploy to Production web app
        run: clasp deploy -i AKfycbyjoryKydzwRJoLzzgzgcgmLZYASjTjWyl8fidtJhXikudFnlqCb1-4j-zPdlwRZ7Y9hA -d "main ${{ github.sha }}"
