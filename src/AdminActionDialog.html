<!DOCTYPE html>
<!--
  [TASK-023] 스프레드시트 「🏨 관리자 도구」 공통 대화상자
  Code.gs openAdminActionDialog(id)가 템플릿 변수 `action`(Config.gs SYSTEM_ACTIONS 항목)을 넣어 띄운다.
  흐름: 안내 → [실행] → runAdminAction(id) → 같은 창에 결과 → [닫기]
  웹앱 Stylesheet/Icons를 그대로 include해 모달과 같은 모양을 낸다 (Docs/UIGuidelines.md).
-->
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <?!= include('Stylesheet') ?>
</head>
<body class="sheet-dialog">
  <?!= include('Icons') ?>

  <div class="sheet-dialog-body">
    <div id="guide" class="action-guide">
      <p class="desc"><?= action.desc ?></p>
      <ul>
        <? for (var i = 0; i < action.bullets.length; i++) { ?>
          <li><?= action.bullets[i] ?></li>
        <? } ?>
      </ul>
    </div>

    <div id="status" class="sheet-dialog-status" hidden>
      <span class="spinner--inline" aria-hidden="true"></span>
      <span>작업 처리 중입니다. 창을 닫지 마세요.</span>
    </div>

    <div id="result" class="sheet-dialog-result" role="status" hidden>
      <svg class="ico" aria-hidden="true"><use id="resultIcon" href="#i-check-circle-2"/></svg>
      <span id="resultText"></span>
    </div>
  </div>

  <div id="footerConfirm" class="sheet-dialog-footer">
    <button type="button" class="btn btn-outline" onclick="google.script.host.close()">취소</button>
    <button type="button" id="btnRun" class="btn <?= action.btnClass ?>" onclick="runAction()"><?= action.btnText ?></button>
  </div>
  <div id="footerDone" class="sheet-dialog-footer" hidden>
    <button type="button" class="btn btn-outline" onclick="google.script.host.close()">닫기</button>
  </div>

  <script>
    var ACTION_ID = '<?= action.id ?>';

    function stripLeadingEmoji(message) {
      return String(message == null ? '' : message).replace(/^[☀-➿\u{1F300}-\u{1FAFF}️]+\s*/u, '');
    }

    // 창 높이를 내용에 맞춘다(늘리고 줄인다). 안내 → 실행 중 → 결과로 내용이 바뀔 때마다 부른다.
    function fitDialog() {
      var h = document.body.scrollHeight;
      try { google.script.host.setHeight(Math.max(140, Math.min(h, 640))); } catch (e) {}
    }

    function runAction() {
      document.getElementById('btnRun').disabled = true;
      document.getElementById('guide').hidden = true;
      document.getElementById('footerConfirm').hidden = true;
      document.getElementById('status').hidden = false;

      google.script.run
        .withSuccessHandler(function (res) {
          showResult(!!(res && res.success), (res && res.message) || (res && res.success ? '완료되었습니다.' : '작업에 실패했습니다.'));
        })
        .withFailureHandler(function (err) {
          showResult(false, '서버 오류: ' + ((err && err.message) || err));
        })
        .runAdminAction(ACTION_ID);
    }

    function showResult(ok, message) {
      document.getElementById('status').hidden = true;
      var box = document.getElementById('result');
      box.className = 'sheet-dialog-result ' + (ok ? 'success' : 'error');
      document.getElementById('resultIcon').setAttribute('href', ok ? '#i-check-circle-2' : '#i-x-circle');
      // 서버 문구 앞의 이모지(❌ 등 기존 메시지)는 떼어 낸다 — 대화상자 안에는 이모지를 쓰지 않는다 (UIGuidelines §3)
      document.getElementById('resultText').textContent = stripLeadingEmoji(message);
      box.hidden = false;
      document.getElementById('footerDone').hidden = false;
      fitDialog();
    }

    window.addEventListener('load', fitDialog);
    setTimeout(fitDialog, 400); // 웹폰트 적용 뒤 한 번 더
  </script>
</body>
</html>
