<style>
/* ═══════════════════════════════════════════════════════════════
   호텔덕구온천 재고 관리 시스템 — B2B SaaS UI 스타일시트
   White & Clean Blue (Pretendard / Slate / Royal Blue)
   ═══════════════════════════════════════════════════════════════ */

@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');

:root {
  /* — 배경 — */
  --bg-primary: #f8fafc;
  --bg-card: #ffffff;
  --bg-sidebar: #ffffff;
  --bg-muted: #f1f5f9;

  /* — 브랜드 / 프라이머리 (클린 로열 블루) — */
  --primary: #2563eb;
  --primary-hover: #1d4ed8;
  --primary-light: #eff6ff;
  --primary-text: #ffffff;

  /* — 텍스트 & 그레이스케일 — */
  --text-primary: #0f172a;
  --text-secondary: #475569;
  --text-muted: #94a3b8;
  --text-inverse: #ffffff;
  --border: #e2e8f0;
  --border-focus: #3b82f6;

  /* — 상태 색상 — */
  --risk: #ef4444;
  --risk-light: #fef2f2;
  --risk-border: #fecaca;
  --risk-text: #dc2626;
  --order: #f59e0b;
  --order-light: #fffbeb;
  --order-border: #fde68a;
  --order-text: #d97706;
  --normal: #10b981;
  --normal-light: #ecfdf5;
  --normal-border: #a7f3d0;
  --normal-text: #059669;

  /* — 섀도우 / 형태 / 모션 — */
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
  --radius: 12px;
  --radius-sm: 8px;
  --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  --focus-ring: 0 0 0 3px rgba(37, 99, 235, 0.15);

  /* — 레거시 토큰 별칭 —
     기존 마크업/스크립트의 인라인 스타일(var(--navy-*), var(--gold*))이
     깨지지 않도록 신규 팔레트로 재매핑한다. 신규 코드는 위 토큰을 사용할 것. */
  --navy-900: #0f172a;
  --navy-800: #1e293b;
  --navy-700: #334155;
  --navy-600: #2563eb;
  --navy-500: #3b82f6;
  --gold: #f59e0b;
  --gold-400: #f59e0b;
  --gold-300: #fbbf24;
  --gold-200: #fcd34d;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 14px; }

body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ═══════════════ 레이아웃 ═══════════════ */
.app-container {
  display: flex;
  min-height: 100vh;
}

.sidebar {
  width: 260px;
  background: var(--bg-sidebar);
  color: var(--text-primary);
  padding: 0;
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  z-index: 100;
  display: flex;
  flex-direction: column;
  transition: var(--transition);
  border-right: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
}

.sidebar-header {
  padding: 24px 20px;
  border-bottom: 1px solid var(--border);
  text-align: center;
}

.sidebar-header .brand-icon {
  font-size: 2rem;
  margin-bottom: 8px;
  display: block;
}

.sidebar-header h1 {
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.4;
  color: var(--text-primary);
}

.sidebar-header .brand-sub {
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--primary);
  margin-top: 6px;
}

.sidebar-nav {
  flex: 1;
  padding: 16px 12px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 14px;
  border-radius: 10px;
  cursor: pointer;
  transition: var(--transition);
  color: var(--text-secondary);
  font-size: 0.92rem;
  font-weight: 500;
  font-family: inherit;
  text-decoration: none;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
}

.nav-item:hover {
  background: var(--bg-muted);
  color: var(--text-primary);
}

.nav-item.active {
  background: var(--primary-light);
  color: var(--primary);
  font-weight: 600;
}

.nav-item .nav-icon { font-size: 1.15rem; width: 24px; text-align: center; }
.nav-item .nav-badge {
  margin-left: auto;
  background: var(--risk);
  color: #fff;
  font-size: 0.7rem;
  line-height: 1.5;
  padding: 1px 8px;
  border-radius: 9999px;
  font-weight: 700;
}

.sidebar-footer {
  padding: 16px 20px;
  border-top: 1px solid var(--border);
  font-size: 0.72rem;
  color: var(--text-muted);
  text-align: center;
  line-height: 1.5;
}

/* 사이드바 하단 로그아웃 (고스트 / 아웃라인 스타일) */
.sidebar-actions {
  padding: 16px 20px;
  border-top: 1px solid var(--border);
}
.sidebar-actions .logout-btn { width: 100%; }
.sidebar-actions + .sidebar-footer { border-top: none; }

.logout-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 14px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  font-size: 0.88rem;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: var(--transition);
}
.logout-btn:hover {
  background: var(--risk-light);
  border-color: var(--risk-border);
  color: var(--risk-text);
}

.main-content {
  flex: 1;
  /* flex item의 자동 최소 크기(min-width:auto)를 해제해야 넓은 테이블이
     본문 폭을 밀어내지 않고 .data-table-wrapper 내부에서 가로 스크롤된다. */
  min-width: 0;
  margin-left: 260px;
  padding: 24px 32px;
  min-height: 100vh;
}

.page-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}

.page-header h2 {
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text-primary);
  white-space: nowrap;
}

/* 페이지 타이틀 + 메타 배지 그룹 */
.page-title-group {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.meta-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--bg-muted);
  border: 1px solid var(--border);
  border-radius: 9999px;
  padding: 5px 14px;
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--text-primary);
  white-space: nowrap;
}
.meta-badge .meta-icon { font-size: 0.9rem; }

.page-header .header-meta {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 8px;
  color: var(--text-secondary);
  font-size: 0.85rem;
}

.page-header .season-badge {
  background: var(--primary-light);
  color: var(--primary);
  border: 1px solid #bfdbfe;
  padding: 5px 14px;
  border-radius: 9999px;
  font-weight: 600;
  font-size: 0.8rem;
}

/* ═══════════════ KPI 카드 ═══════════════ */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}

.kpi-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 20px 24px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
  transition: var(--transition);
  position: relative;
  overflow: hidden;
  cursor: default;
}

/* 상단 4px 바 대신 좌측 미세 액센트 */
.kpi-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  bottom: 0;
  width: 3px;
}

.kpi-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }

.kpi-card.total::before { background: var(--primary); }
.kpi-card.risk::before { background: var(--risk); }
.kpi-card.order::before { background: var(--order); }
.kpi-card.normal::before { background: var(--normal); }

/* 상태별 은은한 파스텔 틴트 */
.kpi-card.risk { background: var(--risk-light); border-color: var(--risk-border); }
.kpi-card.order { background: var(--order-light); border-color: var(--order-border); }

.kpi-label {
  font-size: 0.85rem;
  color: var(--text-secondary);
  font-weight: 500;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.kpi-value {
  font-size: 2.25rem;
  font-weight: 700;
  line-height: 1.1;
  letter-spacing: -0.03em;
  color: var(--text-primary);
  font-variant-numeric: tabular-nums;
}
.kpi-card.risk .kpi-value { color: var(--risk); }
.kpi-card.order .kpi-value { color: var(--order); }
.kpi-card.normal .kpi-value { color: var(--normal); }
.kpi-unit { font-size: 0.9rem; color: var(--text-secondary); margin-left: 4px; font-weight: 500; }

/* ═══════════════ 카드 / 패널 ═══════════════ */
.card {
  background: var(--bg-card);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
  margin-bottom: 24px;
  overflow: hidden;
}

.card-header {
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.card-header h3 {
  font-size: 1.05rem;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 8px;
}

.card-body { padding: 20px 24px; }

/* ═══════════════ 테이블 ═══════════════ */
.data-table-wrapper {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
}

.data-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
}

.data-table thead th {
  background: var(--bg-primary);
  color: var(--text-secondary);
  padding: 12px 16px;
  font-weight: 600;
  font-size: 0.82rem;
  letter-spacing: 0.01em;
  white-space: nowrap;
  text-align: center;
  border-bottom: 1px solid var(--border);
}

.data-table thead th:first-child { border-radius: var(--radius-sm) 0 0 0; }
.data-table thead th:last-child { border-radius: 0 var(--radius-sm) 0 0; }

.data-table tbody td {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 0.87rem;
  color: var(--text-primary);
  text-align: center;
  vertical-align: middle;
  transition: background 0.15s;
  font-variant-numeric: tabular-nums;
}

.data-table tbody td strong { font-weight: 600; }

.data-table tbody tr:hover td { background: var(--bg-muted); }
.data-table tbody tr:last-child td { border-bottom: none; }

.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border-radius: 9999px;
  font-size: 0.75rem;
  font-weight: 600;
  white-space: nowrap;
  border: 1px solid transparent;
}

.status-badge.risk { background: var(--risk-light); color: var(--risk-text); border-color: var(--risk-border); }
.status-badge.order { background: var(--order-light); color: var(--order-text); border-color: var(--order-border); }
.status-badge.normal { background: var(--normal-light); color: var(--normal-text); border-color: var(--normal-border); }

/* ═══════════════ 폼 ═══════════════ */
.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.form-group label {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-secondary);
}

input:not([type="checkbox"]):not([type="radio"]),
select,
textarea {
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 0.9rem;
  font-family: inherit;
  transition: var(--transition);
  background: var(--bg-card);
  color: var(--text-primary);
}

input::placeholder, textarea::placeholder { color: var(--text-muted); }

input:not([type="checkbox"]):not([type="radio"]):focus,
select:focus,
textarea:focus {
  outline: none;
  border-color: var(--border-focus);
  box-shadow: var(--focus-ring);
}

input:disabled, select:disabled, textarea:disabled {
  background: var(--bg-muted);
  color: var(--text-secondary);
  cursor: not-allowed;
}

/* ═══════════════ 버튼 ═══════════════ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 18px;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  font-size: 0.88rem;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: var(--transition);
  text-decoration: none;
  white-space: nowrap;
}

.btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }

.btn-primary {
  background: var(--primary);
  color: var(--primary-text);
}
.btn-primary:hover {
  background: var(--primary-hover);
  box-shadow: var(--shadow-md);
}

.btn-gold {
  background: var(--order);
  color: #78350f;
}
.btn-gold:hover {
  background: #fbbf24;
  box-shadow: var(--shadow-md);
}

.btn-outline {
  background: var(--bg-card);
  color: var(--text-secondary);
  border: 1px solid var(--border);
}
.btn-outline:hover {
  background: var(--bg-muted);
  color: var(--text-primary);
  border-color: #cbd5e1;
}

.btn-danger { background: var(--risk); color: #fff; }
.btn-danger:hover { background: var(--risk-text); box-shadow: var(--shadow-md); }

.btn-sm { padding: 6px 12px; font-size: 0.8rem; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

.btn-group { display: flex; gap: 8px; flex-wrap: wrap; }

/* ═══════════════ 로딩 & 토스트 ═══════════════ */
.loading-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(15, 23, 42, 0.35);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}

.loading-overlay.active { opacity: 1; pointer-events: auto; }

.spinner {
  width: 44px;
  height: 44px;
  border: 3px solid rgba(255, 255, 255, 0.35);
  border-top-color: #ffffff;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.toast-container {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 10000;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.toast {
  padding: 14px 18px;
  border-radius: var(--radius-sm);
  background: var(--bg-card);
  color: var(--text-primary);
  font-size: 0.88rem;
  font-weight: 500;
  border: 1px solid var(--border);
  border-left: 4px solid var(--text-muted);
  box-shadow: var(--shadow-lg);
  animation: slideIn 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  align-items: center;
  gap: 10px;
  max-width: 400px;
}

.toast.success { background: var(--normal-light); border-color: var(--normal-border); border-left-color: var(--normal); }
.toast.error { background: var(--risk-light); border-color: var(--risk-border); border-left-color: var(--risk); }
.toast.warning { background: var(--order-light); border-color: var(--order-border); border-left-color: var(--order); }
.toast.info { background: var(--primary-light); border-color: #bfdbfe; border-left-color: var(--primary); }

@keyframes slideIn {
  from { transform: translateX(100px); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

/* ═══════════════ 모달 ═══════════════ */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(15, 23, 42, 0.4);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 5000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}

.modal-overlay.active { opacity: 1; pointer-events: auto; }

.modal {
  background: var(--bg-card);
  border-radius: 16px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-lg);
  width: 90%;
  max-width: 640px;
  max-height: 85vh;
  overflow-y: auto;
  transform: scale(0.96);
  transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

.modal-overlay.active .modal { transform: scale(1); }

.modal-header {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.modal-header h3 { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.01em; }
.modal-close {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  border: none;
  background: var(--bg-muted);
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 1rem;
  transition: var(--transition);
}
.modal-close:hover { background: var(--risk-light); color: var(--risk-text); }

.modal-body { padding: 24px; }
.modal-footer {
  padding: 16px 24px;
  border-top: 1px solid var(--border);
  background: var(--bg-primary);
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

/* ═══════════════ 탭 콘텐츠 ═══════════════ */
.tab-content { display: none; animation: fadeIn 0.3s ease; }
.tab-content.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ═══════════════ 빈 상태 ═══════════════ */
.empty-state {
  text-align: center;
  padding: 52px 24px;
  color: var(--text-secondary);
}
.empty-state .empty-icon { font-size: 2.6rem; margin-bottom: 10px; display: block; line-height: 1; }
.empty-state p { font-size: 0.92rem; font-weight: 500; }
/* 빈 상태 행은 hover 하이라이트 제외 */
.data-table tbody tr:hover td.empty-state { background: transparent; }

/* ═══════════════ 설정 카드 그리드 ═══════════════ */
.settings-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 20px;
}

.cmd-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 12px;
}

.cmd-card {
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg-card);
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  transition: var(--transition);
}

.cmd-card:hover {
  border-color: var(--primary);
  background: var(--primary-light);
  transform: translateY(-1px);
  box-shadow: var(--shadow-sm);
}

.cmd-card .cmd-icon { font-size: 1.5rem; }
.cmd-card .cmd-text h4 { font-size: 0.9rem; font-weight: 600; margin-bottom: 2px; }
.cmd-card .cmd-text p { font-size: 0.75rem; color: var(--text-secondary); }

/* ═══════════════ 자동완성 ═══════════════ */
.autocomplete-wrapper { position: relative; }
.autocomplete-list {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-top: none;
  border-radius: 0 0 var(--radius-sm) var(--radius-sm);
  max-height: 200px;
  overflow-y: auto;
  z-index: 200;
  box-shadow: var(--shadow-md);
}

.autocomplete-item {
  padding: 10px 14px;
  cursor: pointer;
  font-size: 0.85rem;
  display: flex;
  justify-content: space-between;
  transition: background 0.15s;
}

.autocomplete-item:hover { background: var(--primary-light); }
