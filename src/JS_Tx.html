<script>
// ═══════════════════════════════════════════════════════════════
//  [NEW] 업장 선택 모달
// ═══════════════════════════════════════════════════════════════
function openShopSelectionModal() {
  var shops = Array.from(document.getElementById('txShopSelect').options);
  if (shops.length <= 1) { 
    loadShopList(); 
    showToast('업장 목록을 불러오는 중입니다. 잠시 후 다시 시도해주세요.', 'info');
    return;
  }
  
  // 푸터 없음 — openModal이 푸터를 숨긴다 (TASK-022 #16)
  openModal('작업 업장 선택', '<div id="shopSelectionList" class="shop-list"></div>', '');
  var list = document.getElementById('shopSelectionList');
  var help = document.createElement('p');
  help.className = 'modal-help';
  help.textContent = '입출고 기록을 조회 및 등록할 업장을 명확히 선택해주세요.';
  list.appendChild(help);
  shops.forEach(function(opt) {
    if (!opt.value) return;
    var shopButton = document.createElement('button');
    shopButton.className = 'btn btn-outline';
    shopButton.textContent = opt.textContent;
    shopButton.addEventListener('click', function() { selectShopFromModal(opt.value, opt.textContent); });
    list.appendChild(shopButton);
  });
}

function selectShopFromModal(value, text) {
  var select = document.getElementById('txShopSelect');
  select.value = value;
  // [TASK-021] C-1 칩 구조(.k 라벨 · .v 값 · 아이콘)는 유지하고 값만 바꾼다
  var btn = document.getElementById('btnShopSelectModal');
  if (btn) {
    var v = btn.querySelector('.v');
    if (v) v.textContent = text;
    else btn.innerHTML = '<span class="k">업장</span><span class="v">' + escapeHtml(text) + '</span>' + iconSvg('chevron-down');
  }
  closeModal();
  loadTransactions();
}

// ═══════════════════════════════════════════════════════════════
//  [TASK-021] 구분 세그먼트 (C-6) · 폼 초기화 (C-3) · 관리 드롭다운 (C-7)
//
//  세그먼트는 숨겨진 #txType select에 값을 넣기만 한다. saveTransaction()·E2E가
//  select.value를 읽는 경로는 그대로다. select가 다른 경로(스크립트)로 바뀌면
//  change 이벤트로 세그먼트 표시를 따라 맞춘다.
// ═══════════════════════════════════════════════════════════════
function setTxType(type) {
  var select = document.getElementById('txType');
  if (!select) return;
  var value = type || '';
  if (select.value !== value) {
    select.value = value;
    select.dispatchEvent(new Event('change', { bubbles: true }));
  }
  syncTxTypeSegment();
}

function syncTxTypeSegment() {
  var select = document.getElementById('txType');
  var seg = document.getElementById('txTypeSeg');
  if (!select || !seg) return;
  var value = select.value;
  seg.querySelectorAll('button[data-type]').forEach(function(b) {
    b.setAttribute('aria-pressed', String(b.getAttribute('data-type') === value && value !== ''));
  });
}

function initTxTypeSegment() {
  var seg = document.getElementById('txTypeSeg');
  var select = document.getElementById('txType');
  if (!seg || !select) return;
  seg.querySelectorAll('button[data-type]').forEach(function(b) {
    b.addEventListener('click', function() { setTxType(b.getAttribute('data-type')); });
  });
  select.addEventListener('change', syncTxTypeSegment);
  syncTxTypeSegment();
}

/** 품목·구분·수량·비고를 비운다. 날짜·담당자는 연속 입력을 위해 남긴다. */
function resetTransactionForm() {
  ['txItemNameSearch', 'txItemCode', 'txQty', 'txNote'].forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.value = '';
  });
  var dd = document.getElementById('itemNameDropdown');
  if (dd) dd.hidden = true;
  setTxType('');
}

function toggleTxAdminMenu(e) {
  if (e) e.stopPropagation();
  var menu = document.getElementById('txAdminMenu');
  var btn = document.getElementById('btnTxAdminMenu');
  if (!menu) return;
  var open = menu.hidden;
  menu.hidden = !open;
  if (btn) btn.setAttribute('aria-expanded', String(open));
}

function closeTxAdminMenu() {
  var menu = document.getElementById('txAdminMenu');
  var btn = document.getElementById('btnTxAdminMenu');
  if (menu) menu.hidden = true;
  if (btn) btn.setAttribute('aria-expanded', 'false');
}

document.addEventListener('DOMContentLoaded', function() {
  initTxTypeSegment();
  var menu = document.getElementById('txAdminMenu');
  if (menu) menu.addEventListener('click', function(e) { e.stopPropagation(); });
});
// 바깥 클릭·Esc로 드롭다운 닫기
document.addEventListener('click', function() { closeTxAdminMenu(); });
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeTxAdminMenu(); });

// ═══════════════════════════════════════════════════════════════
//  업장 목록 & 품목코드 로드
// ═══════════════════════════════════════════════════════════════
function loadShopList() {
  google.script.run
    .withSuccessHandler(function(shops) {
      var select = document.getElementById('txShopSelect');
      select.replaceChildren();
      var placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = '업장 선택...';
      select.appendChild(placeholder);
      shops.forEach(function(shop) {
        var opt = document.createElement('option');
        opt.value = shop.name;
        opt.textContent = shop.name + ' (' + shop.category + ')';
        select.appendChild(opt);
      });
    })
    .withFailureHandler(function() {})
    .getShopList(getToken());
}

// [TASK-010] 마감된 기간의 날짜를 아예 고를 수 없게 한다 (서버 검증과 이중 방어).
// 서버(addTransaction)의 validateNotClosedMonth가 1차 방어이고, 이것은 UX 보조다.
var closedCutoffDate = null; // "yyyy-MM-dd" 또는 null(마감 이력 없음)

function loadClosingCutoff() {
  google.script.run
    .withSuccessHandler(function(info) {
      if (!info || !info.success || !info.minDate) return;
      closedCutoffDate = info.cutoff;
      var txDate = document.getElementById('txDate');
      if (txDate) txDate.min = info.minDate;
    })
    .withFailureHandler(function() {})
    .getClosingCutoffInfo(getToken());
}

function loadItemCodes() {
  google.script.run
    .withSuccessHandler(function(items) { itemCodeList = items || []; })
    .withFailureHandler(function(err) { 
      console.error('품목 코드 로드 실패:', err);
      itemCodeList = []; // 실패 시 빈 배열로 초기화
    })
    .getItemCodes(getToken());
}

// ═══════════════════════════════════════════════════════════════
//  품목명 기반 자동완성 — [v9.0] 서버 사이드 검색으로 전환
// ═══════════════════════════════════════════════════════════════
var txSearchTimeout = null;

function onItemNameInput(value) {
  clearTimeout(txSearchTimeout);
  
  var dropdown = document.getElementById('itemNameDropdown');
  var codeField = document.getElementById('txItemCode');
  
  if (!value || value.trim().length < 1) { 
    dropdown.hidden = true;
    codeField.value = '';
    return;
  }

  txSearchTimeout = setTimeout(function() {
    // [v9.0] 서버 사이드 검색 API 호출 (4,000개+ 품목 대응)
    google.script.run
      .withSuccessHandler(function(matches) {
        if (!matches || matches.length === 0) { 
          dropdown.hidden = true;
          codeField.value = '';
          return;
        }

        renderItemMatches(dropdown, matches);
        dropdown.hidden = false;

        // 정확히 일치하는 이름이 있으면 자동으로 코드 기입
        var inputVal = document.getElementById('txItemNameSearch').value.trim();
        var exact = matches.find(function(item) { return item.name.trim() === inputVal; });
        if (exact) codeField.value = exact.code;
        else codeField.value = '';
      })
      .withFailureHandler(function(err) {
        console.error('품목 검색 실패:', err);
        // 서버 검색 실패 시 클라이언트 사이드 폴백
        var query = value.toLowerCase().trim();
        var fallbackMatches = itemCodeList.filter(function(item) {
          return item.name.toLowerCase().indexOf(query) > -1 || item.code.toLowerCase().indexOf(query) > -1;
        }).slice(0, 10);
        
        if (fallbackMatches.length === 0) { dropdown.hidden = true; codeField.value = ''; return; }
        renderItemMatches(dropdown, fallbackMatches);
        dropdown.hidden = false;
      })
      .searchItemCodes(getToken(), value.trim());
  }, 300); // 300ms 디바운스
}

function renderItemMatches(dropdown, matches) {
  var fragment = document.createDocumentFragment();
  matches.forEach(function(item) {
    var row = document.createElement('div');
    row.className = 'autocomplete-item';
    var name = document.createElement('span');
    name.className = 'item-name';
    name.textContent = item.name;
    var code = document.createElement('span');
    code.className = 'item-code';
    code.textContent = ' (' + item.code + ')';
    row.appendChild(name);
    row.appendChild(code);
    row.addEventListener('click', function() { selectItemName(item.code, item.name); });
    fragment.appendChild(row);
  });
  dropdown.replaceChildren(fragment);
}

function selectItemName(code, name) {
  document.getElementById('txItemNameSearch').value = name;
  document.getElementById('txItemCode').value = code;
  document.getElementById('itemNameDropdown').hidden = true;
}

document.addEventListener('click', function(e) {
  if (!e.target.closest('.autocomplete-wrapper')) {
    var dd = document.getElementById('itemNameDropdown');
    if (dd) dd.hidden = true;
  }
});

// ═══════════════════════════════════════════════════════════════
//  입출고 기록
// ═══════════════════════════════════════════════════════════════
function loadTransactions() {
  var shopName = document.getElementById('txShopSelect').value;
  currentShop = shopName;
  if (!shopName) return;
  showLoading();
  google.script.run
    .withSuccessHandler(function(records) { hideLoading(); renderTransactions(records); })
    .withFailureHandler(function(err) { hideLoading(); showToast('기록 로드 실패: ' + err.message, 'error'); })
    .getRecentTransactions(getToken(), shopName, 50);
}

function renderTransactions(records) {
  var tbody = document.getElementById('txTableBody');
  document.getElementById('txCount').textContent = records.length + '건';
  if (records.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="empty-state"><span class="empty-icon">' + iconSvg('inbox') + '</span><p>입출고 기록이 없습니다</p></td></tr>';
    return;
  }
  // [TASK-020] 열 정렬 — 날짜 muted · 코드/ID mono · 구분 ctr(배지) · 수량 num (UIGuidelines §5)
  var TX_CELL_CLASS = ['muted', 'mono', '', 'ctr', 'num', '', 'muted', 'mono'];
  var fragment = document.createDocumentFragment();
  records.forEach(function(r) {
    var tr = document.createElement('tr');
    [r.date, r.code, r.name, r.type, r.qty, r.person || '—', r.note || '—', r.txId || '—'].forEach(function(value, index) {
      var td = document.createElement('td');
      if (TX_CELL_CLASS[index]) td.className = TX_CELL_CLASS[index];
      if (index === 3) {
        td.appendChild(txTypeBadge(r.type));
      } else {
        td.textContent = value == null ? '' : String(value);
      }
      tr.appendChild(td);
    });
    fragment.appendChild(tr);
  });
  tbody.replaceChildren(fragment);
}

/** 입출고 구분 pill — 입고 normal · 출고 primary · 폐기 risk (UIGuidelines §5) */
function txTypeBadge(type) {
  var badge = document.createElement('span');
  badge.className = 'status-badge ' + (type === '입고' ? 'normal' : (type === '폐기' ? 'risk' : 'primary'));
  badge.textContent = type == null ? '' : String(type);
  return badge;
}

function saveTransaction() {
  var shopName = document.getElementById('txShopSelect').value;
  if (!shopName) return showToast('업장을 먼저 선택하세요', 'warning');

  var txData = {
    date: document.getElementById('txDate').value,
    code: document.getElementById('txItemCode').value,
    type: document.getElementById('txType').value,
    qty: document.getElementById('txQty').value,
    person: document.getElementById('txPerson').value,
    note: document.getElementById('txNote').value
  };

  if (!txData.date || !txData.code || !txData.type || !txData.qty) return showToast('날짜, 품목코드, 구분, 수량은 필수입니다', 'warning');
  if (Number(txData.qty) <= 0) return showToast('수량은 1 이상이어야 합니다', 'warning');
  // [TASK-010] 마감된 기간은 서버에서도 거부되지만, 왕복 전에 즉시 안내한다
  if (closedCutoffDate && txData.date <= closedCutoffDate) {
    return showToast(closedCutoffDate + ' 이전은 이미 월마감된 기간입니다. 당월 재고조정으로 등록하세요', 'error');
  }

  showLoading();
  google.script.run
    .withSuccessHandler(function(result) {
      hideLoading();
      if (result.success) {
        showToast(result.message, 'success');
        resetTransactionForm(); // [TASK-021] 날짜·담당자는 남기고 나머지 초기화
        loadTransactions();
      } else { showToast(result.message, 'error'); }
    })
    .withFailureHandler(function(err) { hideLoading(); showToast('저장 실패: ' + err.message, 'error'); })
    .addTransaction(getToken(), shopName, txData);
}

// ═══════════════════════════════════════════════════════════════
//  [TASK-019] 입출고 일괄 업로드 (CSV / XLSX)
//
//  흐름: 안내문 모달 → 파일 선택 → 클라이언트 파싱·1차 검증
//        → 서버 사전 검증(dryRun, 쓰기 없음) → 확인 모달
//        → BULK_TX_CHUNK_SIZE 단위로 순차 저장(진행률) → 결과 요약 → 목록 새로고침
//
//  "전체를 먼저 검증하고, 하나라도 틀리면 아무것도 저장하지 않는다"가 원칙이다.
//  청크 단위 저장은 GAS 6분 실행 제한 때문이지 부분 저장을 허용하려는 것이 아니다.
//  서버 규칙(검증·FIFO 분할·담당자=로그인 사용자)은 uploadBulkTransactions가 단건 등록과 같은 코드로 보장한다.
// ═══════════════════════════════════════════════════════════════
var BULK_TX_COLUMNS = ['날짜', '품목코드', '구분', '수량', '비고'];
var bulkUploadState = { shopName: '', fileName: '', rows: [], running: false };

function bulkChunkSize() {
  return (typeof BULK_TX_CHUNK_SIZE === 'number' && BULK_TX_CHUNK_SIZE > 0) ? BULK_TX_CHUNK_SIZE : 100;
}
function bulkMaxRows() {
  return (typeof BULK_TX_MAX_ROWS === 'number' && BULK_TX_MAX_ROWS > 0) ? BULK_TX_MAX_ROWS : 2000;
}

// ── 1) 안내문 모달 ──
function openBulkUploadModal() {
  var shopName = document.getElementById('txShopSelect').value;
  if (!shopName) {
    showToast('업장을 먼저 선택하세요', 'warning');
    return openShopSelectionModal();
  }
  bulkUploadState.shopName = shopName;
  bulkUploadState.rows = [];
  bulkUploadState.fileName = '';

  var body =
    '<div id="bulkGuide" class="bulk-guide">' +
      '<p class="mb-12">대상 업장: <strong>' + escapeHtml(shopName) + '</strong></p>' +
      '<div class="callout">' +
        '<strong>파일 형식</strong> — CSV 또는 엑셀(XLSX) 파일, 첫 번째 시트만 읽습니다.<br>' +
        '첫 행은 제목 행으로 두고 아래 열을 채워 주세요. (제목이 있으면 열 순서가 달라도 이름으로 찾습니다)' +
      '</div>' +
      '<div class="data-table-wrapper mb-12">' +
        '<table class="data-table"><thead><tr><th>열</th><th class="ctr">필수</th><th>규칙</th></tr></thead><tbody>' +
          '<tr><td><strong>날짜</strong></td><td class="ctr">필수</td><td>YYYY-MM-DD (엑셀 날짜 셀도 가능). 마감된 기간의 날짜는 거부됩니다.</td></tr>' +
          '<tr><td><strong>품목코드</strong></td><td class="ctr">필수</td><td>품목 마스터에 등록된 코드 (품목명이 아닙니다)</td></tr>' +
          '<tr><td><strong>구분</strong></td><td class="ctr">필수</td><td>입고 / 출고 / 폐기 중 하나</td></tr>' +
          '<tr><td><strong>수량</strong></td><td class="ctr">필수</td><td>0보다 큰 숫자</td></tr>' +
          '<tr><td><strong>비고</strong></td><td></td><td>선택, 500자 이내</td></tr>' +
        '</tbody></table>' +
      '</div>' +
      '<ul>' +
        '<li>담당자는 <strong>로그인한 사용자</strong>로 기록됩니다 (파일의 담당자 열은 무시).</li>' +
        '<li>저장 전에 <strong>파일 전체를 먼저 검증</strong>합니다. 오류가 하나라도 있으면 <strong>아무것도 저장하지 않고</strong> 오류 행을 보여 드립니다.</li>' +
        '<li>출고·폐기는 단건 등록과 똑같이 <strong>FIFO 로트별로 분할</strong> 저장됩니다. 파일 안의 앞선 입고가 뒤의 출고에 반영됩니다.</li>' +
        '<li>한 번에 최대 <strong>' + bulkMaxRows().toLocaleString('ko-KR') + '건</strong>. ' + bulkChunkSize() + '건씩 나누어 저장되므로 완료될 때까지 <strong>창을 닫거나 새로고침하지 마세요</strong>.</li>' +
      '</ul>' +
      '<p class="warn-text">저장된 기록은 웹앱에서 되돌릴 수 없습니다(시트에서 직접 삭제). 업로드 전 파일을 한 번 더 확인하세요.</p>' +
    '</div>';

  var footer =
    '<button class="btn btn-outline" onclick="closeModal()">취소</button>' +
    '<button class="btn btn-outline" onclick="downloadBulkTemplate()">' + iconSvg('download') + ' 양식 다운로드</button>' +
    '<button class="btn btn-primary" id="btnBulkStart" onclick="startBulkFileSelect()">' + iconSvg('upload') + ' 파일 선택 후 시작</button>';
  openModal('입출고 일괄 업로드', body, footer);
}

/** 제목 행 + 예시 1행짜리 XLSX 양식. 예시 행은 지우고 쓰라고 비고에 적어 둔다. */
function downloadBulkTemplate() {
  if (typeof XLSX === 'undefined') return showToast('엑셀 라이브러리를 불러오지 못했습니다. 페이지를 새로고침해 주세요.', 'error');
  var today = new Date();
  var ymd = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
  var ws = XLSX.utils.aoa_to_sheet([
    BULK_TX_COLUMNS,
    [ymd, 'ITEM-0001', '입고', 10, '예시 행입니다 — 지우고 실제 데이터를 입력하세요']
  ]);
  ws['!cols'] = [{ wch: 12 }, { wch: 16 }, { wch: 8 }, { wch: 8 }, { wch: 40 }];
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '입출고');
  XLSX.writeFile(wb, '입출고_일괄업로드_양식.xlsx');
}

function startBulkFileSelect() {
  var input = document.getElementById('txBulkFile');
  input.value = ''; // 같은 파일을 다시 골라도 change가 나게 한다
  input.click();
}

// ── 2) 파일 읽기 · 파싱 ──
function onBulkFileSelected(input) {
  var file = input.files && input.files[0];
  if (!file) return;
  var shopName = bulkUploadState.shopName || document.getElementById('txShopSelect').value;
  if (!shopName) return showToast('업장을 먼저 선택하세요', 'warning');
  bulkUploadState.shopName = shopName;
  bulkUploadState.fileName = file.name;

  showLoading();
  readBulkFile(file, function(err, aoa) {
    if (err) { hideLoading(); return showToast(err.message, 'error'); }

    var parsed = parseBulkRows(aoa);
    var totalRows = parsed.rows.length + parsed.errors.length;
    if (totalRows === 0) { hideLoading(); return showToast('데이터 행이 없습니다. 제목 행 아래에 내용을 입력했는지 확인하세요.', 'warning'); }
    if (totalRows > bulkMaxRows()) {
      hideLoading();
      return showToast('한 번에 최대 ' + bulkMaxRows().toLocaleString('ko-KR') + '건까지 업로드할 수 있습니다. (파일: ' + totalRows + '건)', 'error');
    }
    if (parsed.errors.length > 0) { hideLoading(); return showBulkErrors(totalRows, parsed.errors, '파일 형식 검사에서 오류가 발견되었습니다.'); }

    // 서버 사전 검증 — 품목코드 존재·마감 기간 등 시트를 알아야 하는 규칙. 아무것도 쓰지 않는다.
    google.script.run
      .withSuccessHandler(function(r) {
        hideLoading();
        if (!r || !r.success) {
          return showBulkErrors(totalRows, (r && r.errors) || [], (r && r.message) || '서버 검증에 실패했습니다.');
        }
        bulkUploadState.rows = parsed.rows;
        showBulkConfirm(parsed.rows, parsed.hasHeader);
      })
      .withFailureHandler(function(e) { hideLoading(); showToast('검증 실패: ' + e.message, 'error'); })
      .uploadBulkTransactions(getToken(), shopName, parsed.rows, { dryRun: true });
  });
}

/**
 * 파일을 2차원 배열(aoa)로 읽는다.
 * CSV는 인코딩을 스스로 판별한다 — 엑셀이 저장한 CSV는 흔히 EUC-KR(CP949)이라
 * UTF-8로만 읽으면 한글이 깨진다. UTF-8 엄격 디코딩이 실패하면 EUC-KR로 다시 읽는다.
 */
function readBulkFile(file, cb) {
  if (typeof XLSX === 'undefined') return cb(new Error('엑셀 라이브러리를 불러오지 못했습니다. 페이지를 새로고침해 주세요.'));
  var reader = new FileReader();
  reader.onerror = function() { cb(new Error('파일을 읽을 수 없습니다.')); };
  reader.onload = function(e) {
    try {
      var buf = e.target.result;
      var wb;
      if (/\.(csv|txt)$/i.test(file.name)) {
        wb = XLSX.read(decodeBulkCsv(buf), { type: 'string', raw: true }); // raw: 문자열을 날짜/숫자로 임의 변환하지 않는다
      } else {
        wb = XLSX.read(new Uint8Array(buf), { type: 'array', cellDates: true }); // 날짜 셀은 Date 객체로 받는다
      }
      var ws = wb.Sheets[wb.SheetNames[0]];
      if (!ws) return cb(new Error('읽을 수 있는 시트가 없습니다.'));
      cb(null, XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' }));
    } catch (ex) {
      cb(new Error('파일을 해석할 수 없습니다: ' + ex.message));
    }
  };
  reader.readAsArrayBuffer(file);
}

function decodeBulkCsv(buf) {
  var bytes = new Uint8Array(buf);
  try { return new TextDecoder('utf-8', { fatal: true }).decode(bytes); }
  catch (e) {
    try { return new TextDecoder('euc-kr').decode(bytes); }
    catch (e2) { return new TextDecoder('utf-8').decode(bytes); }
  }
}

/** 제목 행이면 열 이름 → 인덱스 매핑, 아니면 null (그때는 고정 순서로 읽는다) */
function detectBulkHeader(firstRow) {
  if (!firstRow) return null;
  var aliases = {
    date: ['날짜', '거래일', '일자', 'date'],
    code: ['품목코드', '코드', 'code', 'itemcode'],
    type: ['구분', '거래구분', 'type'],
    qty:  ['수량', 'qty', 'quantity'],
    note: ['비고', '메모', 'note', 'remark', 'memo']
  };
  var map = {};
  firstRow.forEach(function(cell, idx) {
    var key = String(cell == null ? '' : cell).replace(/\s+/g, '').toLowerCase();
    if (!key) return;
    Object.keys(aliases).forEach(function(field) {
      if (map[field] === undefined && aliases[field].indexOf(key) >= 0) map[field] = idx;
    });
  });
  var required = ['date', 'code', 'type', 'qty'];
  var found = required.every(function(f) { return map[f] !== undefined; });
  if (!found) return null;
  if (map.note === undefined) map.note = -1;
  return map;
}

function normalizeBulkDate(v) {
  if (v instanceof Date) {
    if (isNaN(v.getTime())) return '';
    return v.getFullYear() + '-' + String(v.getMonth() + 1).padStart(2, '0') + '-' + String(v.getDate()).padStart(2, '0');
  }
  if (typeof v === 'number') {
    if (v >= 20000 && v <= 80000 && typeof XLSX !== 'undefined' && XLSX.SSF) { // 엑셀 날짜 일련번호
      var d = XLSX.SSF.parse_date_code(v);
      if (d) return d.y + '-' + String(d.m).padStart(2, '0') + '-' + String(d.d).padStart(2, '0');
    }
    v = String(v);
  }
  var s = String(v == null ? '' : v).trim();
  var m = /^(\d{4})[-./](\d{1,2})[-./](\d{1,2})(?:\D.*)?$/.exec(s);
  if (m) return m[1] + '-' + m[2].padStart(2, '0') + '-' + m[3].padStart(2, '0');
  m = /^(\d{4})(\d{2})(\d{2})$/.exec(s);
  if (m) return m[1] + '-' + m[2] + '-' + m[3];
  return '';
}

function normalizeBulkQty(v) {
  if (typeof v === 'number') return v;
  var s = String(v == null ? '' : v).replace(/[,\s]/g, '');
  if (!s) return NaN;
  return Number(s);
}

/** aoa → { rows:[{rowNo,date,code,type,qty,note}], errors:[{row,message}], hasHeader } — 빈 행은 건너뛴다 */
function parseBulkRows(aoa) {
  var header = detectBulkHeader(aoa[0]);
  var col = header || { date: 0, code: 1, type: 2, qty: 3, note: 4 };
  var start = header ? 1 : 0;
  var rows = [], errors = [];

  for (var i = start; i < aoa.length; i++) {
    var r = aoa[i];
    if (!r || r.every(function(c) { return c === '' || c === null || c === undefined; })) continue;
    var rowNo = i + 1; // 파일에서 사람이 보는 행 번호(제목 행 포함)
    var cell = function(idx) { return (idx >= 0 && idx < r.length) ? r[idx] : ''; };

    var date = normalizeBulkDate(cell(col.date));
    var code = String(cell(col.code) == null ? '' : cell(col.code)).trim();
    var type = String(cell(col.type) == null ? '' : cell(col.type)).trim();
    var qty = normalizeBulkQty(cell(col.qty));
    var note = String(cell(col.note) == null ? '' : cell(col.note)).trim();

    var problems = [];
    if (!date) problems.push('날짜 형식 오류(YYYY-MM-DD)');
    if (!code) problems.push('품목코드 누락');
    if (['입고', '출고', '폐기'].indexOf(type) < 0) problems.push('구분은 입고/출고/폐기 중 하나');
    if (!(qty > 0) || !isFinite(qty)) problems.push('수량은 0보다 큰 숫자');
    if (note.length > 500) problems.push('비고 500자 초과');

    if (problems.length) errors.push({ row: rowNo, message: problems.join(', ') });
    else rows.push({ rowNo: rowNo, date: date, code: code, type: type, qty: qty, note: note });
  }
  return { rows: rows, errors: errors, hasHeader: !!header };
}

// ── 3) 결과 · 확인 모달 ──
function showBulkErrors(total, errors, headline) {
  var body =
    '<p class="mb-8">' + escapeHtml(headline || '') + '</p>' +
    '<p class="mb-12 text-secondary">파일 <strong>' + escapeHtml(bulkUploadState.fileName) + '</strong> · 전체 ' + total + '건 중 오류 <strong class="text-risk">' + errors.length + '건</strong>. <strong>아무것도 저장하지 않았습니다.</strong></p>' +
    '<div class="data-table-wrapper scroll-box"><table class="data-table"><thead><tr><th class="num w-70">행</th><th>오류</th></tr></thead><tbody id="bulkErrorBody"></tbody></table></div>';
  var footer =
    '<button class="btn btn-outline" onclick="closeModal()">닫기</button>' +
    '<button class="btn btn-primary" onclick="startBulkFileSelect()">다른 파일 선택</button>';
  openModal('검증 실패 — 저장하지 않았습니다', body, footer);

  var tbody = document.getElementById('bulkErrorBody');
  var MAX = 50;
  errors.slice(0, MAX).forEach(function(e) {
    var tr = document.createElement('tr');
    var tdRow = document.createElement('td'); tdRow.className = 'num text-bold'; tdRow.textContent = e.row + '행';
    var tdMsg = document.createElement('td'); tdMsg.textContent = e.message;
    tr.appendChild(tdRow); tr.appendChild(tdMsg); tbody.appendChild(tr);
  });
  if (errors.length > MAX) {
    var tr = document.createElement('tr');
    var td = document.createElement('td'); td.colSpan = 2; td.className = 'muted'; td.textContent = '… 외 ' + (errors.length - MAX) + '건';
    tr.appendChild(td); tbody.appendChild(tr);
  }
}

function showBulkConfirm(rows, hasHeader) {
  var counts = { '입고': 0, '출고': 0, '폐기': 0 };
  rows.forEach(function(r) { counts[r.type]++; });

  var body =
    '<p class="mb-8">파일 <strong>' + escapeHtml(bulkUploadState.fileName) + '</strong> → 업장 <strong>' + escapeHtml(bulkUploadState.shopName) + '</strong></p>' +
    '<p class="mb-12">검증 통과 <strong>' + rows.length + '건</strong> — 입고 ' + counts['입고'] + ' · 출고 ' + counts['출고'] + ' · 폐기 ' + counts['폐기'] +
      (hasHeader ? '' : ' <span class="text-secondary">(제목 행 없음 — 고정 열 순서로 읽음)</span>') + '</p>' +
    '<div class="data-table-wrapper scroll-box scroll-box--sm mb-12"><table class="data-table"><thead><tr>' +
      '<th class="num">행</th><th>날짜</th><th class="mono">품목코드</th><th class="ctr">구분</th><th class="num">수량</th><th>비고</th></tr></thead><tbody id="bulkPreviewBody"></tbody></table></div>' +
    '<p class="warn-text">저장을 시작하면 되돌릴 수 없습니다. ' + bulkChunkSize() + '건씩 나누어 저장되며, 완료될 때까지 창을 닫지 마세요.</p>';
  var footer =
    '<button class="btn btn-outline" onclick="closeModal()">취소</button>' +
    '<button class="btn btn-primary" id="btnBulkRun" onclick="runBulkUpload()">' + rows.length + '건 저장 시작</button>';
  openModal('업로드 확인', body, footer);

  var tbody = document.getElementById('bulkPreviewBody');
  var MAX = 20;
  rows.slice(0, MAX).forEach(function(r) {
    var tr = document.createElement('tr');
    var PREVIEW_CELL_CLASS = ['num', 'muted', 'mono', 'ctr', 'num', 'muted'];
    [r.rowNo, r.date, r.code, r.type, r.qty, r.note || '—'].forEach(function(v, idx) {
      var td = document.createElement('td');
      if (PREVIEW_CELL_CLASS[idx]) td.className = PREVIEW_CELL_CLASS[idx];
      if (idx === 3) td.appendChild(txTypeBadge(r.type));
      else td.textContent = String(v);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  if (rows.length > MAX) {
    var tr = document.createElement('tr');
    var td = document.createElement('td'); td.colSpan = 6; td.className = 'muted'; td.textContent = '… 외 ' + (rows.length - MAX) + '건';
    tr.appendChild(td); tbody.appendChild(tr);
  }
}

// ── 4) 청크 저장 ──
function runBulkUpload() {
  if (bulkUploadState.running) return;
  var rows = bulkUploadState.rows;
  var shopName = bulkUploadState.shopName;
  if (!rows.length || !shopName) return showToast('업로드할 데이터가 없습니다. 파일을 다시 선택하세요.', 'warning');

  var size = bulkChunkSize();
  var chunks = [];
  for (var i = 0; i < rows.length; i += size) chunks.push(rows.slice(i, i + size));

  bulkUploadState.running = true;
  var closeBtn = document.querySelector('#modalOverlay .modal-close');
  if (closeBtn) closeBtn.hidden = true; // 진행 중 닫기 방지

  openModal('저장 중…',
    '<p id="bulkProgressText" class="mb-8 text-bold">0 / ' + rows.length + '건</p>' +
    '<div class="progress"><div id="bulkProgressBar" class="progress-bar"></div></div>' +
    '<p class="warn-text">완료될 때까지 이 창을 닫거나 새로고침하지 마세요.</p>',
    '');

  var done = 0, saved = 0, written = 0, overdraft = 0;
  var RETRY_MAX = 2;

  function updateProgress() {
    var t = document.getElementById('bulkProgressText');
    var b = document.getElementById('bulkProgressBar');
    if (t) t.textContent = done + ' / ' + rows.length + '건';
    if (b) b.style.width = Math.round(done / rows.length * 100) + '%';
  }

  function finish(failure) {
    bulkUploadState.running = false;
    if (closeBtn) closeBtn.hidden = false;
    bulkUploadState.rows = [];
    loadTransactions();

    if (!failure) {
      var msg = saved + '건 저장 완료 (시트 ' + written + '행' + (written > saved ? ', FIFO 분할 포함' : '') + ')' +
        (overdraft > 0 ? ' · 초과출고 ' + overdraft + '건은 마스터 단가로 기록' : '');
      showToast(msg, 'success');
      openModal('업로드 완료',
        '<p class="text-lg mb-8">' + escapeHtml(msg) + '</p>' +
        '<p class="text-secondary">최근 입출고 내역이 갱신되었습니다. 재고 수치는 다음 통합 갱신 때 반영됩니다.</p>',
        '<button class="btn btn-primary" onclick="closeModal()">확인</button>');
      return;
    }

    var firstUnsaved = failure.chunk[0].rowNo;
    var reason = failure.error ? ('통신 오류: ' + failure.error.message) : ((failure.result && failure.result.message) || '알 수 없는 오류');
    showToast('업로드가 중단되었습니다 (' + done + '/' + rows.length + '건 저장)', 'error');
    openModal('업로드 중단',
      '<p class="mb-8">' + done + '건은 저장되었고, 파일의 <strong>' + firstUnsaved + '행부터</strong>는 저장되지 않았습니다.</p>' +
      '<p class="mb-12 text-risk">' + escapeHtml(reason) + '</p>' +
      (failure.error
        ? '<p class="text-secondary">통신 오류는 서버가 저장을 끝냈는데 응답만 유실됐을 수도 있습니다. 최근 입출고 내역에서 ' + firstUnsaved + '행 내용이 있는지 확인한 뒤, 없는 행부터 다시 업로드하세요.</p>'
        : '<p class="text-secondary">파일에서 ' + firstUnsaved + '행 이전을 지우고 나머지만 다시 업로드하세요.</p>'),
      '<button class="btn btn-primary" onclick="closeModal()">확인</button>');
  }

  function sendChunk(idx, attempt) {
    if (idx >= chunks.length) return finish(null);
    var chunk = chunks[idx];
    google.script.run
      .withSuccessHandler(function(r) {
        if (!r || !r.success) {
          // 락 대기 초과("⏳")는 서버가 아무것도 쓰지 않은 상태이므로 재시도해도 중복이 생기지 않는다
          if (r && /⏳/.test(r.message || '') && attempt < RETRY_MAX) {
            return setTimeout(function() { sendChunk(idx, attempt + 1); }, 2000);
          }
          return finish({ chunk: chunk, result: r });
        }
        done += chunk.length;
        saved += r.saved || 0;
        written += r.rowsWritten || 0;
        overdraft += r.overdraftCount || 0;
        updateProgress();
        sendChunk(idx + 1, 0);
      })
      // 통신 오류는 서버가 이미 저장했을 수 있으므로 자동 재시도하지 않는다(중복 방지) — 사람이 확인하도록 안내
      .withFailureHandler(function(e) { finish({ chunk: chunk, error: e }); })
      .uploadBulkTransactions(getToken(), shopName, chunk, { dryRun: false });
  }

  sendChunk(0, 0);
}

</script>
