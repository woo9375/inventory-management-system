<script>
/**
 * 호텔덕구온천 재고 관리 시스템 v1.0.0 — 클라이언트 JavaScript
 * [MODIFIED] 토큰 기반 인증 + google.script.run 서버 통신
 */

// ═══════════════════════════════════════════════════════════════
//  전역 상태
// ═══════════════════════════════════════════════════════════════
let itemCodeList = [];
let currentShop = '';
let currentUser = null;  // [NEW] { username, name, dept, role }
let authToken = '';      // [NEW] 세션 토큰

// ═══════════════════════════════════════════════════════════════
//  [NEW] 인증 — 로그인 / 로그아웃 / 세션
// ═══════════════════════════════════════════════════════════════

function getToken() { return authToken; }

function submitLogin() {
  var username = document.getElementById('loginUsername').value.trim();
  var password = document.getElementById('loginPassword').value;
  var errEl = document.getElementById('loginError');
  var btn = document.getElementById('loginBtn');

  if (!username || !password) {
    errEl.textContent = '아이디와 비밀번호를 입력해 주세요.';
    return;
  }

  errEl.textContent = '';
  btn.disabled = true;
  btn.textContent = '로그인 중...';

  google.script.run
    .withSuccessHandler(function(result) {
      btn.disabled = false;
      btn.textContent = '로그인';
      if (result.success) {
        authToken = result.token;
        currentUser = result.user;
        var remember = document.getElementById('rememberMe').checked;
        if (remember) {
          localStorage.setItem('authToken', result.token);
          localStorage.setItem('currentUser', JSON.stringify(result.user));
          sessionStorage.removeItem('authToken');
          sessionStorage.removeItem('currentUser');
        } else {
          sessionStorage.setItem('authToken', result.token);
          sessionStorage.setItem('currentUser', JSON.stringify(result.user));
          localStorage.removeItem('authToken');
          localStorage.removeItem('currentUser');
        }
        onLoginSuccess();
      } else {
        errEl.textContent = result.message;
      }
    })
    .withFailureHandler(function(err) {
      btn.disabled = false;
      btn.textContent = '로그인';
      errEl.textContent = '서버 오류: ' + err.message;
    })
    .login(username, password);
}

function onLoginSuccess() {
  // 로그인 화면 숨기기
  document.getElementById('loginContainer').classList.add('hidden');
  document.getElementById('appContainer').hidden = false;


  // [NEW] 내 설정 데이터 바인딩
  if (document.getElementById('mySettingsUsername')) {
    document.getElementById('mySettingsUsername').value = currentUser.username;
    document.getElementById('mySettingsName').value = currentUser.name;
    document.getElementById('mySettingsDept').value = currentUser.dept;
    document.getElementById('mySettingsRole').value = currentUser.role.toLowerCase();
    
    var shopContainer = document.getElementById('mySettingsShops');
    shopContainer.innerHTML = '';
    var helpText = document.querySelector('#mySettingsShops + small');
    
    if (currentUser.role === 'admin' || currentUser.role === 'manager') {
      shopContainer.innerHTML = '<span class="status-badge primary">전체 업장 접근 가능</span>';
      if (helpText) helpText.textContent = "모든 업장에 접근 및 관리 권한이 있습니다.";
    } else {
      if (currentUser.assignedShops && currentUser.assignedShops.length > 0) {
        currentUser.assignedShops.forEach(function(shop) {
          var badge = document.createElement('span');
          badge.className = 'status-badge normal';
          badge.textContent = shop;
          shopContainer.appendChild(badge);
        });
      } else {
        shopContainer.innerHTML = '<span class="text-muted">배정된 업장이 없습니다.</span>';
      }
      if (helpText) helpText.textContent = "접근 가능한 업장 목록입니다. 권한 변경이 필요하면 관리자에게 문의하세요.";
    }
  }

  // 역할별 UI 분기
  applyRolePermissions();

  // 데이터 로드 — [TASK-027] 대시보드·업장 목록·마감 기준일·마지막 동기화 시각을 왕복 1회(getBootstrapData)로 받는다.
  //   전에는 네 호출을 따로 쏘고(+ 품목 코드 150KB), 각각 약 1초의 왕복 비용을 냈다.
  //   품목 코드 목록은 서버 검색 폴백에만 쓰이므로 필요해질 때 받는다(JS_Tx ensureItemCodes).
  loadBootstrap();

  // 마지막 취합 시간 폴링 (1분 간격 유지)
  if (window.syncPollInterval) clearInterval(window.syncPollInterval);
  window.syncPollInterval = setInterval(updateLastSyncTime, 60000);
}

function loadBootstrap() {
  showLoading();
  google.script.run
    .withSuccessHandler(function(boot) {
      hideLoading();
      if (!boot || boot.success === false) {
        showToast((boot && boot.message) || '초기 데이터를 불러오지 못했습니다', 'error');
        return;
      }
      applyShopList(boot.shops);
      applyClosingCutoff(boot.closing);
      applyLastSyncTime(boot.lastSync);
      // staff는 대시보드 권한이 없어 success:false가 온다 — 탭 자체가 숨겨져 있으므로 조용히 넘긴다
      if (boot.dashboard && boot.dashboard.success !== false) renderDashboard(boot.dashboard);
    })
    .withFailureHandler(function(err) {
      hideLoading();
      showToast('초기 데이터 로드 실패: ' + err.message, 'error');
      // 묶음 호출이 실패하면 예전 방식(개별 호출)으로 한 번 더 시도한다
      loadDashboard(); loadShopList(); loadClosingCutoff(); updateLastSyncTime();
    })
    .getBootstrapData(getToken());
}

function updateLastSyncTime() {
  google.script.run
    .withSuccessHandler(applyLastSyncTime)
    .getLastSyncTime(getToken());
}

function applyLastSyncTime(res) {
  if (res && res.success && res.timestamp) {
    var d = new Date(res.timestamp);
    var timeStr = d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    document.getElementById('lastSyncTimeText').textContent = timeStr;
  } else {
    document.getElementById('lastSyncTimeText').textContent = "기록 없음";
  }
}

function applyRolePermissions() {
  var isAdmin = currentUser.role === 'admin';
  var isManager = currentUser.role === 'manager';

  // .admin-only 요소 제어 (업장/시즌/사용자/시스템 탭 및 버튼들)
  // [TASK-022] 표시/숨김은 hidden 속성으로 — .admin-only[hidden] { display: none !important } (Stylesheet)
  document.querySelectorAll('.admin-only').forEach(function(el) {
    el.hidden = !isAdmin;
  });

  // [TASK-025] .admin-manager-only — 품목 관리처럼 admin과 구매팀(manager)이 함께 쓰는 요소. staff에게만 숨긴다.
  //   .admin-only의 의미를 넓히지 않고 클래스를 따로 둔다 (Stylesheet .admin-manager-only[hidden]).
  document.querySelectorAll('.admin-manager-only').forEach(function(el) {
    el.hidden = !(isAdmin || isManager);
  });
}

function doLogout() {
  google.script.run
    .withSuccessHandler(function() {})
    .withFailureHandler(function() {})
    .logout(getToken());

  authToken = '';
  currentUser = null;
  sessionStorage.removeItem('authToken');
  sessionStorage.removeItem('currentUser');
  localStorage.removeItem('authToken');
  localStorage.removeItem('currentUser');

  // UI 초기화
  document.getElementById('loginContainer').classList.remove('hidden');
  document.getElementById('appContainer').hidden = true;
  document.getElementById('loginUsername').value = '';
  document.getElementById('loginPassword').value = '';
  document.getElementById('loginError').textContent = '';
}

// 페이지 로드 시 세션 복원 시도
document.addEventListener('DOMContentLoaded', function() {
  var savedToken = localStorage.getItem('authToken') || sessionStorage.getItem('authToken');
  var savedUserStr = localStorage.getItem('currentUser') || sessionStorage.getItem('currentUser');
  
  if (savedToken && savedUserStr) {
    // 서버에서 세션 검증
    google.script.run
      .withSuccessHandler(function(result) {
        if (result.success) {
          authToken = savedToken;
          currentUser = result.user;
          // 스토리지 갱신
          if (localStorage.getItem('authToken')) {
            localStorage.setItem('currentUser', JSON.stringify(result.user));
          } else {
            sessionStorage.setItem('currentUser', JSON.stringify(result.user));
          }
          onLoginSuccess();
        } else {
          // 세션 만료 → 로그인 화면
          sessionStorage.removeItem('authToken');
          sessionStorage.removeItem('currentUser');
          localStorage.removeItem('authToken');
          localStorage.removeItem('currentUser');
        }
      })
      .withFailureHandler(function() {
        sessionStorage.removeItem('authToken');
        sessionStorage.removeItem('currentUser');
        localStorage.removeItem('authToken');
        localStorage.removeItem('currentUser');
      })
      .getSessionUser(savedToken);
  }

  // 오늘 날짜 기본값
  var today = new Date().toISOString().split('T')[0];
  var txDate = document.getElementById('txDate');
  if (txDate) txDate.value = today;
});

</script>
