<script>
// ═══════════════════════════════════════════════════════════════
//  설정
// ═══════════════════════════════════════════════════════════════
var modalActionContext = {};

// [TASK-027] 업장·시즌·사용자 탭이 같은 응답을 쓴다 — 탭 캐시(JS_UI loadWithTabCache)로 한 번만 받는다.
//   등록/수정/삭제 뒤에는 loadConfig(true)로 강제 갱신한다.
function loadConfig(force) {
  loadWithTabCache('config', force, renderConfig, function(withOverlay, onDone) {
    google.script.run
      .withSuccessHandler(function(config) {
        if (withOverlay) hideLoading();
        if (config.success === false) { showToast(config.message, 'error'); return; }
        onDone(config);
      })
      .withFailureHandler(function(err) { if (withOverlay) hideLoading(); showToast('설정 로드 실패: ' + err.message, 'error'); })
      .getConfigData(getToken());
  });
}

function renderConfig(config) {
  var isAdmin = currentUser && currentUser.role === 'admin';
  window.currentShops = config.shops || []; // 업장 목록 저장

  // 업장 테이블
  var shopBody = document.getElementById('shopTableBody');
  shopBody.replaceChildren();
  (config.shops || []).forEach(function(s) {
    var tr = document.createElement('tr');
    [s.category, s.name, s.tag].forEach(function(value, index) {
      var td = createConfigCell(value);
      if (index === 2) td.className = 'mono';
      tr.appendChild(td);
    });
    // [TASK-020] 상태는 .status-badge pill 하나로 — 생성완료 normal · 그 외 order
    var statusCell = document.createElement('td'); statusCell.className = 'ctr';
    var statusBadge = document.createElement('span');
    statusBadge.className = 'status-badge ' + (s.status === '생성완료' ? 'normal' : 'order');
    statusBadge.textContent = s.status == null ? '' : String(s.status);
    statusCell.appendChild(statusBadge); tr.appendChild(statusCell);
    if (isAdmin) {
      var actionCell = document.createElement('td'); actionCell.className = 'ctr actions';
      actionCell.appendChild(actionButton('delete', 'trash-2', '삭제', function() { confirmDeleteShop(s.name); }));
      tr.appendChild(actionCell);
    }
    shopBody.appendChild(tr);
  });

  // 시즌 테이블
  var seasonBody = document.getElementById('seasonTableBody');
  seasonBody.replaceChildren();
  (config.seasons || []).forEach(function(s) {
    var tr = document.createElement('tr');
    [s.name, s.start, s.end, '×' + s.multiplier].forEach(function(value, index) {
      var td = createConfigCell(value);
      if (index === 3) td.className = 'num';
      tr.appendChild(td);
    });
    if (isAdmin) {
      var actionCell = document.createElement('td'); actionCell.className = 'ctr actions';
      actionCell.appendChild(actionButton('edit', 'pencil', '수정', function() { openEditSeasonModal(s.name, s.start, s.end, s.multiplier); }));
      actionCell.appendChild(actionButton('delete', 'trash-2', '삭제', function() { confirmDeleteSeason(s.name); }));
      tr.appendChild(actionCell);
    }
    seasonBody.appendChild(tr);
  });

  // 사용자 테이블
  var userBody = document.getElementById('userTableBody');
  userBody.replaceChildren();
  (config.users || []).forEach(function(u) {
    var tr = document.createElement('tr');
    [u.username, u.name, u.dept].forEach(function(value) { tr.appendChild(createConfigCell(value)); });
    // [TASK-020] 역할 배지 — admin primary · manager order · staff muted (.role-badge 폐기)
    var roleCell = document.createElement('td'); roleCell.className = 'ctr';
    var roleBadge = document.createElement('span');
    roleBadge.className = 'status-badge ' + (ROLE_BADGE_CLASS[u.role] || 'muted');
    roleBadge.textContent = u.role; roleCell.appendChild(roleBadge); tr.appendChild(roleCell);
    if (isAdmin) {
      var actionCell = document.createElement('td'); actionCell.className = 'ctr actions';
      actionCell.appendChild(actionButton('edit', 'pencil', '수정', function() { openEditUserModal(u.username, u.name, u.dept, u.role, (u.assignedShops || []).join(',')); }));
      actionCell.appendChild(actionButton('key', 'key-round', '비밀번호 초기화', function() { openResetPasswordModal(u.username); }));
      actionCell.appendChild(actionButton('delete', 'trash-2', '삭제', function() { confirmDeleteUser(u.username); }));
      tr.appendChild(actionCell);
    }
    userBody.appendChild(tr);
  });
}

function createConfigCell(value) {
  var td = document.createElement('td');
  td.textContent = value == null ? '' : String(value);
  return td;
}

var ROLE_BADGE_CLASS = { admin: 'primary', manager: 'order', staff: 'muted' };

/** [TASK-020] 테이블 행 액션 버튼 (Lucide 아이콘, title/aria-label로 이름 제공) — JS_Vendor에서도 쓴다 */
function actionButton(kind, icon, title, onClick) {
  var button = document.createElement('button');
  button.className = 'action-btn ' + kind;
  button.title = title;
  button.setAttribute('aria-label', title);
  button.innerHTML = iconSvg(icon);
  button.addEventListener('click', onClick);
  return button;
}

//  [NEW] 업장 CRUD 모달
// ═══════════════════════════════════════════════════════════════
function openAddShopModal() {
  var body = '<div class="form-grid">' +
    '<div class="form-group"><label>분류</label><select id="newShopCategory"><option value="">선택...</option></select></div>' +
    '<div class="form-group"><label>업장명</label><input type="text" id="newShopName" placeholder="예: 맛다락"></div>' +
    '<div class="form-group form-group--wide"><label>거래ID 태그 (2~3자)</label><input type="text" id="newShopTag" placeholder="예: TX" maxlength="3"></div></div>';
  var footer = '<button class="btn btn-outline" onclick="closeModal()">취소</button><button class="btn btn-primary" onclick="submitNewShop()">추가</button>';
  openModal('업장 추가', body, footer);

  // 분류 드롭다운
  google.script.run.withSuccessHandler(function(config) {
    var sel = document.getElementById('newShopCategory');
    var cats = ['호텔','콘도','빌리지','스파월드','식음','조리','관리','구매','판촉'];
    cats.forEach(function(c) { var o = document.createElement('option'); o.value = c; o.textContent = c; sel.appendChild(o); });
  }).getConfigData(getToken());
}

function submitNewShop() {
  var data = {
    category: document.getElementById('newShopCategory').value,
    name: document.getElementById('newShopName').value.trim(),
    tag: document.getElementById('newShopTag').value.trim().toUpperCase()
  };
  if (!data.category || !data.name || !data.tag) return showToast('필수 필드를 입력해주세요', 'warning');

  // [v9.0] 태그 ID 유효성 검사: 영어 대문자 2~3자만 허용
  if (!/^[A-Z]{2,3}$/.test(data.tag)) {
    return showToast('태그 ID는 영어 대문자 2~3자로만 입력해야 합니다. (예: TX, MB, AXC)', 'warning');
  }

  showLoading();
  google.script.run
    .withSuccessHandler(function(r) { hideLoading(); showToast(r.message, r.success ? 'success' : 'error'); if (r.success) { closeModal(); loadConfig(true); loadShopList(); } })
    .withFailureHandler(function(e) { hideLoading(); showToast('오류: ' + e.message, 'error'); })
    .addShop(getToken(), data);
}

function confirmDeleteShop(name) {
  modalActionContext.name = name;
  var body = '<p class="modal-msg">업장 <strong>"' + escapeHtml(name) + '"</strong>을(를) 비활성화하시겠습니까?<br><span class="text-normal text-sm">입출고 데이터는 보존되며, 시트는 숨김 처리됩니다.</span></p>';
  var footer = '<button class="btn btn-outline" onclick="closeModal()">취소</button><button class="btn btn-danger" onclick="doDeleteShop(modalActionContext.name)"> 비활성화</button>';
  openModal('업장 비활성화 확인', body, footer);
}

function doDeleteShop(name) {
  showLoading();
  google.script.run
    .withSuccessHandler(function(r) { hideLoading(); showToast(r.message, r.success ? 'success' : 'error'); if (r.success) { closeModal(); loadConfig(true); loadShopList(); } })
    .withFailureHandler(function(e) { hideLoading(); showToast('오류: ' + e.message, 'error'); })
    .deleteShop(getToken(), name);
}

    '<div class="form-group"><label>시작일</label><input type="date" id="newSeasonStart"></div>' +
    '<div class="form-group"><label>종료일</label><input type="date" id="newSeasonEnd"></div>' +

  openModal('시즌 삭제 확인', body, footer);
}

function doDeleteSeason(name) {
  showLoading();
  google.script.run.withSuccessHandler(function(r) { hideLoading(); showToast(r.message, r.success ? 'success' : 'error'); if (r.success) { closeModal(); loadConfig(true); } })
    .withFailureHandler(function(e) { hideLoading(); showToast('오류: ' + e.message, 'error'); }).deleteSeason(getToken(), name);

  var body = '<div class="form-grid">' +
    '<div class="form-group"><label>아이디 (회사 이메일)</label><input type="email" id="newUserUsername" placeholder="예: hong_gd@dukgu.com"></div>' +
    '<div class="form-group"><label>초기 비밀번호</label><input type="password" id="newUserPassword" placeholder="8자 이상"></div>' +
    '<div class="form-group"><label>성함</label><input type="text" id="newUserName" placeholder="이름"></div>' +
    '<div class="form-group"><label>부서</label><input type="text" id="newUserDept" placeholder="부서명"></div>' +
    '<div class="form-group"><label>역할</label><select id="newUserRole"><option value="staff">staff (담당자)</option><option value="manager">manager (매니저)</option><option value="admin">admin (관리자)</option></select></div></div>';
  var footer = '<button class="btn btn-outline" onclick="closeModal()">취소</button><button class="btn btn-primary" onclick="submitCreateUser()">생성</button>';
  openModal('사용자 계정 생성', body, footer);
}

function submitCreateUser() {
  var data = {
    username: document.getElementById('newUserUsername').value.trim(),
    password: document.getElementById('newUserPassword').value,
    name: document.getElementById('newUserName').value.trim(),
    dept: document.getElementById('newUserDept').value.trim(),
    role: document.getElementById('newUserRole').value
  };
  if (!data.username || !data.password || !data.name || !data.role) return showToast('모든 필수 필드를 입력해주세요', 'warning');
  if (data.password.length < 8) return showToast('비밀번호는 8자 이상이어야 합니다', 'warning');

  showLoading();
  google.script.run.withSuccessHandler(function(r) { hideLoading(); showToast(r.message, r.success ? 'success' : 'error'); if (r.success) { closeModal(); loadConfig(true); } })
    .withFailureHandler(function(e) { hideLoading(); showToast('오류: ' + e.message, 'error'); }).createUser(getToken(), data);
}

function openEditUserModal(username, name, dept, role, shopsStr) {
  modalActionContext.username = username;
  var assigned = (shopsStr || '').split(',').map(s => s.trim()).filter(Boolean);
  
  var shopsHtml = '<div id="editUserShopsContainer" class="checkbox-group">';
  if (window.currentShops && window.currentShops.length > 0) {
    window.currentShops.forEach(function(s) {
      var isChecked = assigned.includes(s.name) ? 'checked' : '';
      shopsHtml += '<label>' +
                   '<input type="checkbox" name="editUserShops" value="' + escapeHtml(s.name) + '" ' + isChecked + '> ' + escapeHtml(s.name) +
                   '</label>';
    });
  } else {
    shopsHtml += '<span class="text-muted">등록된 업장이 없습니다.</span>';
  }
  shopsHtml += '</div>';
  shopsHtml += '<small id="editUserShopsHelp" class="form-help"></small>';

  var body = '<div class="form-grid">' +
    '<div class="form-group"><label>아이디</label><input type="text" value="' + escapeHtml(username) + '" readonly></div>' +
    '<div class="form-group"><label>성함</label><input type="text" id="editUserName" value="' + escapeHtml(name) + '"></div>' +
    '<div class="form-group"><label>부서</label><input type="text" id="editUserDept" value="' + escapeHtml(dept) + '"></div>' +
    '<div class="form-group"><label>역할</label><select id="editUserRole" onchange="toggleEditShops(this.value)">' +
      '<option value="staff"' + (role==='staff'?' selected':'') + '>staff</option>' +
      '<option value="manager"' + (role==='manager'?' selected':'') + '>manager</option>' +
      '<option value="admin"' + (role==='admin'?' selected':'') + '>admin</option></select></div>' +
    '<div class="form-group form-group--wide"><label>배정된 업장</label>' + shopsHtml + '</div></div>';
    
  var footer = '<button class="btn btn-outline" onclick="closeModal()">취소</button><button class="btn btn-primary" onclick="submitEditUser(modalActionContext.username)">저장</button>';
  openModal('사용자 수정 — ' + username, body, footer);
  
  // 모달 열 때 초기 상태 설정
  toggleEditShops(role);
}

function toggleEditShops(role) {
  var cbs = document.querySelectorAll('input[name="editUserShops"]');
  var helpText = document.getElementById('editUserShopsHelp');
  var isPrivileged = (role === 'admin' || role === 'manager');
  
  cbs.forEach(function(cb) {
    cb.disabled = isPrivileged;
    if (isPrivileged) {
      cb.checked = true; // 시각적 편의를 위해 전체 선택
    }
  });
  
  if (helpText) {
    if (isPrivileged) {
      helpText.textContent = "Admin 및 Manager는 모든 업장에 접근 및 관리 권한이 있어 개별 배정이 불필요합니다.";
      helpText.classList.add('is-privileged'); // [TASK-022] 색·굵기는 .form-help.is-privileged
    } else {
      helpText.textContent = "해당 계정이 접근할 업장을 선택해주세요.";
      helpText.classList.remove('is-privileged');
    }
  }
}

function submitEditUser(username) {
  var selectedShops = [];
  var checkboxes = document.querySelectorAll('input[name="editUserShops"]:checked');
  checkboxes.forEach(function(cb) { selectedShops.push(cb.value); });
  
  var updates = { 
    name: document.getElementById('editUserName').value, 
    dept: document.getElementById('editUserDept').value, 
    role: document.getElementById('editUserRole').value,
    assignedShops: selectedShops
  };
  showLoading();
  google.script.run.withSuccessHandler(function(r) { hideLoading(); showToast(r.message, r.success ? 'success' : 'error'); if (r.success) { closeModal(); loadConfig(true); } })
    .withFailureHandler(function(e) { hideLoading(); showToast('오류: ' + e.message, 'error'); }).updateUser(getToken(), username, updates);
}

function openResetPasswordModal(username) {
  modalActionContext.username = username;
  var body = '<div class="form-grid"><div class="form-group form-group--wide"><label><strong>' + escapeHtml(username) + '</strong>의 새 비밀번호</label><input type="password" id="resetNewPw" placeholder="8자 이상"></div></div>';
  var footer = '<button class="btn btn-outline" onclick="closeModal()">취소</button><button class="btn btn-primary" onclick="submitResetPassword(modalActionContext.username)">초기화</button>';
  openModal('비밀번호 초기화', body, footer);
}

function submitResetPassword(username) {
  var newPw = document.getElementById('resetNewPw').value;
  if (!newPw || newPw.length < 8) return showToast('비밀번호는 8자 이상이어야 합니다', 'warning');
  showLoading();
  google.script.run.withSuccessHandler(function(r) { hideLoading(); showToast(r.message, r.success ? 'success' : 'error'); if (r.success) closeModal(); })
    .withFailureHandler(function(e) { hideLoading(); showToast('오류: ' + e.message, 'error'); }).resetPassword(getToken(), username, newPw);
}

function confirmDeleteUser(username) {
  modalActionContext.username = username;
  var body = '<p class="modal-msg">계정 <strong>"' + escapeHtml(username) + '"</strong>을(를) 삭제하시겠습니까?</p>';
  var footer = '<button class="btn btn-outline" onclick="closeModal()">취소</button><button class="btn btn-danger" onclick="doDeleteUser(modalActionContext.username)">삭제</button>';

function doDeleteUser(username) {
  showLoading();
  google.script.run.withSuccessHandler(function(r) { hideLoading(); showToast(r.message, r.success ? 'success' : 'error'); if (r.success) { closeModal(); loadConfig(true); } })
    .withFailureHandler(function(e) { hideLoading(); showToast('오류: ' + e.message, 'error'); }).deleteUser(getToken(), username);
}

// ═══════════════════════════════════════════════════════════════
//  [NEW] 수동 월마감 기능
// ═══════════════════════════════════════════════════════════════
// [TASK-028] 모달은 "지금 마감할 수 있는 달"만 고를 수 있게 한다. 서버 _validateClosingTarget이 1차 방어이고
//   이 화면은 실수 방지용 보조다(TASK-010의 거래일 min과 같은 이중 방어). 규칙은 서버와 같다:
//   끝난 달만 · 마감 이력이 있으면 기준일의 다음 달만 · 이력이 없으면 지난 아무 달이나.
function isClosableMonth(info, year, month, today) {
  var nextFirst = new Date(year, month, 1); // 대상 월의 다음 달 1일
  if (today < nextFirst) return false;      // 아직 끝나지 않은 달
  if (info && info.cutoff && info.nextClosable) {
    return year === info.nextClosable.year && month === info.nextClosable.month;
  }
  return true;
}

/** 기본 선택: 다음 마감 대상(이력 있음) 또는 지난달(이력 없음) */
function defaultClosingTarget(info, today) {
  if (info && info.cutoff && info.nextClosable) return { year: info.nextClosable.year, month: info.nextClosable.month };
  var prev = new Date(today.getFullYear(), today.getMonth() - 1, 1);
  return { year: prev.getFullYear(), month: prev.getMonth() + 1 };
}

function openMonthlyClosingModal() {
  if (currentUser && currentUser.role !== 'admin') {
    return showToast('최고 관리자만 실행할 수 있습니다.', 'error');
  }
  // 기준일은 로그인 때 받아 두지만, 마감은 되돌릴 수 없는 작업이라 열 때마다 최신 값을 다시 읽는다.
  showLoading();
  loadClosingCutoff(function(info) {
    hideLoading();
    if (!info || !info.success) return showToast('마감 기준일을 확인하지 못했습니다. 잠시 후 다시 시도하세요.', 'error');
    renderMonthlyClosingModal(info, new Date());
  });
}

function renderMonthlyClosingModal(info, today) {
  var target = defaultClosingTarget(info, today);
  var currYear = today.getFullYear();
  var firstYear = Math.min(currYear - 1, target.year);
  var lastYear = Math.max(currYear, target.year);

  var yrOptions = '';
  for (var y = firstYear; y <= lastYear; y++) {
    var yearClosable = false;
    for (var mm = 1; mm <= 12 && !yearClosable; mm++) yearClosable = isClosableMonth(info, y, mm, today);
    yrOptions += '<option value="' + y + '"' + (y === target.year ? ' selected' : '') + (yearClosable ? '' : ' disabled') + '>' + y + '년</option>';
  }
  var mthOptions = '';
  for (var m = 1; m <= 12; m++) {
    mthOptions += '<option value="' + m + '"' + (m === target.month ? ' selected' : '') + '>' + m + '월</option>';
  }

  var guide;
  if (info.cutoff) {
    guide = '현재 마감 기준일: <strong>' + info.cutoff + '</strong> · 다음 마감 대상: <strong>' + target.year + '년 ' + target.month + '월</strong>';
    if (!isClosableMonth(info, target.year, target.month, today)) {
      var nextFirst = new Date(target.year, target.month, 1);
      guide += ' <span class="text-muted">(' + (nextFirst.getMonth() + 1) + '월 1일 이후 가능)</span>';
    }
  } else {
    guide = '현재 마감 기준일: <strong>마감 이력 없음</strong> · 다음 마감 대상: <strong>지난 월 선택 가능</strong>';
  }

  var body = '<div class="form-grid">' +
    '<div class="form-group form-group--wide">' +
    '<div class="callout" id="closingGuide">' + guide + '</div>' +
    '<p class="warn-text mb-8">경고: 월마감을 실행하면 선택한 연/월 이전의 모든 과거 데이터가 별도의 드라이브 시트로 분리되며, 현재 메인 시트에서 삭제됩니다. 남은 재고는 새롭게 선입선출 이월 기록으로 생성됩니다.</p>' +
    '</div>' +
    '<div class="form-group"><label>마감 기준 연도</label><select id="closingYear" onchange="refreshClosingMonthOptions()">' + yrOptions + '</select></div>' +
    '<div class="form-group"><label>마감 기준 월</label><select id="closingMonth">' + mthOptions + '</select></div>' +
    '</div>';

  var footer = '<button class="btn btn-outline" onclick="closeModal()">취소</button><button class="btn btn-danger" onclick="confirmMonthlyClosing()">실행</button>';
  openModal('월마감 및 재고 이월 실행', body, footer);
  refreshClosingMonthOptions();
}

/** 선택한 연도에 맞춰 고를 수 없는 달을 disabled 처리한다 (연도를 바꾸면 다시 계산) */
function refreshClosingMonthOptions() {
  var yearSel = document.getElementById('closingYear');
  var monthSel = document.getElementById('closingMonth');
  if (!yearSel || !monthSel) return;
  var year = Number(yearSel.value);
  var today = new Date();
  for (var i = 0; i < monthSel.options.length; i++) {
    var opt = monthSel.options[i];
    opt.disabled = !isClosableMonth(closingCutoffInfo, year, Number(opt.value), today);
  }
}

function confirmMonthlyClosing() {
  var year = document.getElementById('closingYear').value;
  var month = document.getElementById('closingMonth').value;
  
  var body = '<h3 class="modal-title-danger">정말 ' + year + '년 ' + month + '월 마감을 실행하시겠습니까?</h3>' + 
             '<p class="modal-msg">이 작업은 되돌릴 수 없습니다.<br>계속하시려면 <strong>동의</strong>라고 입력해주세요.</p>' +
             '<input type="text" id="closingConfirmText" class="w-full mt-10 text-center" placeholder="동의">';
  var footer = '<button class="btn btn-outline" onclick="closeModal()">취소</button><button class="btn btn-danger" onclick="submitMonthlyClosing(' + year + ', ' + month + ')">최종 마감 실행</button>';
  openModal('월마감 최종 확인', body, footer);
}

function submitMonthlyClosing(year, month) {
  var txt = document.getElementById('closingConfirmText').value;
  if (txt !== '동의') {
    return showToast('"동의"라고 입력하셔야 실행됩니다.', 'warning');
  }
  
  showLoading();
  // 시간이 오래 걸리는 작업이므로 토스트 띄우기
  showToast('마감 및 이월 데이터 생성 중... 시간이 다소 소요될 수 있습니다.', 'info');
  
  google.script.run
    .withSuccessHandler(function(res) {
      hideLoading();
      if (res.success) {
        showToast(itemMsg(res.message), 'success');
        closeModal();
        // [TASK-028] 기준일이 바뀌었으니 거래일 하한(txDate.min)과 다음 모달의 안내를 최신으로
        loadClosingCutoff();
      } else {
        showToast('마감 실패: ' + itemMsg(res.message), 'error');
      }
    })
    .withFailureHandler(function(err) {
      hideLoading();
      showToast('네트워크/서버 오류: ' + err.message, 'error');
    })
    .executeMonthlyClosing(getToken(), year, month);
}

// ═══════════════════════════════════════════════════════════════
//  시스템 명령 실행기
//  [TASK-023] 안내 문구는 SYSTEM_ACTIONS(Config.gs SSOT)에서만 온다 — 시트 관리자 도구 대화상자와 같은 문장.
//  모달 마크업은 JS_UI.html의 systemActionGuideHtml/systemActionFooterHtml을 시트 동기화 모달과 공유한다.
// ═══════════════════════════════════════════════════════════════
function doSystemCommand(command) {
  var conf = getSystemActionConfig(command);
  if (!conf || conf.scope === 'sheet') return showToast('알 수 없는 명령어입니다.', 'error');
  if (conf.requiresAdmin && currentUser && currentUser.role !== 'admin') {
    return showToast('최고 관리자만 실행할 수 있습니다.', 'error');
  }

  openModal(conf.title, systemActionGuideHtml(conf),
    systemActionFooterHtml(conf, "submitSystemCommand('" + command + "')", 'btnSystemCommandSubmit'));
}

function submitSystemCommand(command) {
  closeModal();
  showLoading();
  showToast('작업 실행 중...', 'info');
  
  google.script.run
    .withSuccessHandler(function(res) {
      hideLoading();
      if (res.success) {
        showToast(res.message, 'success');
        // [TASK-029] 재고를 다시 계산한 명령은 서버 캐시를 비웠으니 화면도 다시 그린다 — 「시트 동기화」(doForceRefresh)와 같은 후처리.
        //   전에는 토스트만 띄워 KPI·알림 표·재고 계산 기준이 갱신 전 값으로 남았다. 다른 명령(권한·시즌·백업)은 재고와 무관.
        if (command === 'refreshDashboard' || command === 'incrementalSync') {
          clearTabData();
          loadDashboard();
        }
      } else {
        showToast(res.message, 'warning');
      }
    })
    .withFailureHandler(function(err) {
      hideLoading();
      showToast('명령 실행 중 오류 발생: ' + err.message, 'error');
    })
    .runSystemCommand(getToken(), command);
}
</script>
