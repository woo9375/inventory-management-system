<script>
// ═══════════════════════════════════════════════════════════════
//  [NEW] 기초데이터 관리 (Phase 6)
// ═══════════════════════════════════════════════════════════════
function loadBaseData() {
  showLoading();
  google.script.run
    .withSuccessHandler(function(res) {
      hideLoading();
      if (!res.success) return showToast(res.message, 'error');
      renderBaseData(res);
    })
    .withFailureHandler(function(err) { hideLoading(); showToast('기초데이터 로드 실패: ' + err.message, 'error'); })
    .getBaseData(getToken());
}

function renderBaseData(data) {
  var isAdmin = currentUser && currentUser.role === 'admin';
  var renderChips = function(items, type) {
    if (!items || items.length === 0) return '<span class="empty-state">데이터가 없습니다.</span>';
    return items.map(function(item) {
      var safeItem = item.replace(/'/g, "\\'").replace(/"/g, '&quot;');
      var html = '<div class="chip">' + escapeHtml(item);
      if (isAdmin) html += '<button class="chip-delete" onclick="deleteBaseDataItem(\'' + type + '\', \'' + safeItem + '\')">×</button>';
      html += '</div>';
      return html;
    }).join('');
  };

  document.getElementById('mainCatList').innerHTML = renderChips(data.mainCategories, 'mainCategory');
  document.getElementById('unitList').innerHTML = renderChips(data.units, 'unit');
  document.getElementById('itemCatList').innerHTML = renderChips(data.itemCategories, 'itemCategory');
}

function addBaseDataItem(type) {
  var inputMap = { mainCategory: 'newMainCat', unit: 'newUnit', itemCategory: 'newItemCat' };
  var inputEl = document.getElementById(inputMap[type]);
  var value = inputEl.value.trim();
  
  if (!value) return showToast('값을 입력하세요.', 'warning');

  showLoading();
  google.script.run
    .withSuccessHandler(function(r) {
      hideLoading();
      showToast(r.message, r.success ? 'success' : 'error');
      if (r.success) {
        inputEl.value = '';
        loadBaseData();
      }
    })
    .withFailureHandler(function(e) { hideLoading(); showToast('추가 실패: ' + e.message, 'error'); })
    .addBaseDataItem(getToken(), type, value);
}

function deleteBaseDataItem(type, value) {
  if (!confirm('정말로 "' + value + '" 항목을 삭제하시겠습니까?\n이 항목을 사용 중인 품목이 있을 수 있습니다.')) return;

  showLoading();
  google.script.run
    .withSuccessHandler(function(r) {
      hideLoading();
      showToast(r.message, r.success ? 'success' : 'error');
      if (r.success) loadBaseData();
    })
    .withFailureHandler(function(e) { hideLoading(); showToast('삭제 실패: ' + e.message, 'error'); })
    .deleteBaseDataItem(getToken(), type, value);
}
// ═══════════════════════════════════════════════════════════════
//  [NEW] 재고 실사 인쇄 (Phase 7)
// ═══════════════════════════════════════════════════════════════
function printPhysicalCheckList() {
  showLoading();
  google.script.run
    .withSuccessHandler(function(items) {
      hideLoading();
      if (!items || items.length === 0) {
        showToast('인쇄할 품목 데이터가 없습니다.', 'warning');
        return;
      }
      
      var container = document.getElementById('printContainer');
      var dateStr = new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' });
      
      var html = '<div class="print-header">' +
                 '<h1>📋 재고 실사 조사표</h1>' +
                 '<p>출력일자: ' + dateStr + '</p>' +
                 '</div>' +
                 '<table class="print-table">' +
                 '<thead><tr>' +
                 '<th>품목코드</th><th>품목명</th><th>카테고리</th><th>단위</th>' +
                 '<th>전산재고</th><th style="width: 15%">실사재고</th><th style="width: 20%">비고</th>' +
                 '</tr></thead><tbody>';
      
      items.forEach(function(item) {
        html += '<tr>' +
                '<td>' + item.code + '</td>' +
                '<td style="text-align: left">' + item.name + '</td>' +
                '<td>' + item.category + '</td>' +
                '<td>' + item.unit + '</td>' +
                '<td style="font-weight: bold">' + item.currentStock + '</td>' +
                '<td></td><td></td>' +
                '</tr>';
      });
      
      html += '</tbody></table>';
      container.innerHTML = html;
      
      // 브라우저 인쇄 호출
      setTimeout(function() {
        window.print();
        // 인쇄 후 내용 초기화
        setTimeout(function() { container.innerHTML = ''; }, 1000);
      }, 500);
    })
    .withFailureHandler(function(err) {
      hideLoading();
      showToast('데이터 로드 실패: ' + err.message, 'error');
    })
    .getItemMasterData(getToken());
}

function downloadPhysicalCheckListExcel() {
  showLoading();
  google.script.run
    .withSuccessHandler(function(items) {
      hideLoading();
      if (!items || items.length === 0) {
        showToast('다운로드할 품목 데이터가 없습니다.', 'warning');
        return;
      }

      try {
        // SheetJS용 데이터 배열 준비
        var excelData = [];
        // Header
        excelData.push(["품목코드", "품목명", "카테고리", "단위", "전산재고", "실사재고", "비고"]);

        items.forEach(function(item) {
          excelData.push([
            item.code,
            item.name || '',
            item.category || '',
            item.unit || '',
            item.currentStock || 0,
            '', // 실사재고 (빈칸)
            ''  // 비고 (빈칸)
          ]);
        });

        // 워크북 및 워크시트 생성
        var wb = XLSX.utils.book_new();
        var ws = XLSX.utils.aoa_to_sheet(excelData);
        XLSX.utils.book_append_sheet(wb, ws, "재고실사조사표");

        // 파일명 생성
        var dateStr = new Date().toISOString().slice(0, 10).replace(/-/g, "");
        var fileName = "재고실사조사표_" + dateStr + ".xlsx";

        // [FIX] GAS 웹앱은 샌드박스 iframe 안에서 렌더링되므로 XLSX.writeFile()의
        // 내장 저장 로직이 일부 브라우저/인앱 브라우저에서 조용히 실패할 수 있다.
        // Blob을 직접 생성하고 <a download> 요소를 DOM에 실제로 삽입한 뒤 클릭하는
        // 방식이 더 넓은 환경에서 안정적으로 동작하는 표준적인 대안이다.
        var wbArray = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
        var blob = new Blob([wbArray], { type: 'application/octet-stream' });
        var url = URL.createObjectURL(blob);

        var link = document.createElement('a');
        link.href = url;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
      } catch (e) {
        // [FIX] 기존 코드는 클라이언트 측 예외를 아무 곳에서도 잡지 않아
        // 다운로드 실패 시 사용자에게 아무런 피드백이 없었다(무반응처럼 보임).
        showToast('엑셀 파일 생성에 실패했습니다: ' + e.message, 'error');
      }
    })
    .withFailureHandler(function(err) {
      hideLoading();
      showToast('데이터 로드 실패: ' + err.message, 'error');
    })
    .getItemMasterData(getToken());
}
</script>
