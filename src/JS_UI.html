<script>
// ═══════════════════════════════════════════════════════════════
//  [TASK-027] 탭 데이터 클라이언트 캐시
//
//  google.script.run 왕복은 아무것도 읽지 않는 함수도 약 1초다(DEV 실측 955ms). 업장·시즌·사용자 탭은
//  같은 getConfigData 응답을 쓰는데 탭을 옮길 때마다 서버를 다시 불렀다. 이제 응답을 세션 동안 들고 있다가
//  · 1분 안에 다시 열면 서버를 부르지 않고 그린다
//  · 그보다 오래됐으면 들고 있던 것을 먼저 그리고 뒤에서 조용히 새로 받아 다시 그린다(오버레이 없음)
//  · 등록/수정/삭제 직후와 「시트 동기화」는 강제로 새로 받는다(loadXxx(true) / clearTabData())
// ═══════════════════════════════════════════════════════════════
var TAB_CACHE_FRESH_MS = 60000;
var tabDataCache = {};

function getTabData(key) { return tabDataCache[key] || null; }
function setTabData(key, data) { tabDataCache[key] = { data: data, at: Date.now() }; }
function clearTabData(key) { if (key) delete tabDataCache[key]; else tabDataCache = {}; }
function isTabDataFresh(entry) { return !!entry && (Date.now() - entry.at) < TAB_CACHE_FRESH_MS; }

/**
 * 캐시 우선 로더. render(data)로 그리고, fetch(onDone)로 서버를 부른다 — fetch는 결과를 onDone(data)에 넘긴다.
 * @param {string} key 캐시 키
 * @param {boolean} force true면 캐시를 무시하고 오버레이를 띄운 채 새로 받는다
 */
function loadWithTabCache(key, force, render, fetch) {
  var cached = force ? null : getTabData(key);
  if (cached) {
    render(cached.data);
    if (isTabDataFresh(cached)) return;
    fetch(false, function(data) { setTabData(key, data); render(data); });
    return;
  }
  showLoading();
  fetch(true, function(data) { setTabData(key, data); render(data); });
}

// ═══════════════════════════════════════════════════════════════
//  네비게이션
// ═══════════════════════════════════════════════════════════════
function showTab(tabId, navEl) {
  document.querySelectorAll('.tab-content').forEach(function(el) { el.classList.remove('active'); });
  document.getElementById('tab-' + tabId).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(function(el) { el.classList.remove('active'); });
  if (navEl) navEl.classList.add('active');

  if (tabId === 'transactions') {
    if (currentUser) document.getElementById('txPerson').value = currentUser.name;
    var currentShop = document.getElementById('txShopSelect').value;
    if (!currentShop && typeof openShopSelectionModal === 'function') {
      setTimeout(openShopSelectionModal, 100);
    }
  }
  if (tabId === 'shop' || tabId === 'season' || tabId === 'user') loadConfig();
  if (tabId === 'basedata') loadBaseData();
  if (tabId === 'vendor') loadVendors(); // [TASK-018]
  if (tabId === 'items') loadItems();    // [TASK-025]

  closeSidebar();
}

function submitMyPasswordChange() {
  var oldPw = document.getElementById('myOldPw').value;
  var newPw = document.getElementById('myNewPw').value;
  if (!oldPw || !newPw) return showToast('비밀번호를 모두 입력해주세요', 'warning');
  if (newPw.length < 8) return showToast('새 비밀번호는 8자 이상이어야 합니다', 'warning');

  showLoading();
  google.script.run
    .withSuccessHandler(function(r) { 
      hideLoading(); 
      showToast(r.message, r.success ? 'success' : 'error'); 
      if (r.success) {
        document.getElementById('myOldPw').value = '';
        document.getElementById('myNewPw').value = '';
      }
    })
    .withFailureHandler(function(e) { hideLoading(); showToast('오류: ' + e.message, 'error'); })
    .changePassword(getToken(), oldPw, newPw);
}

// [TASK-022] 모바일 사이드바 — 열릴 때 백드롭(#sidebarBackdrop)도 함께, 백드롭 클릭·탭 이동 시 닫힘
function toggleSidebar() {
  var sidebar = document.getElementById('sidebar');
  var isOpen = sidebar.classList.toggle('open');
  var backdrop = document.getElementById('sidebarBackdrop');
  if (backdrop) backdrop.classList.toggle('active', isOpen);
}

function closeSidebar() {
  var sidebar = document.getElementById('sidebar');
  if (sidebar) sidebar.classList.remove('open');
  var backdrop = document.getElementById('sidebarBackdrop');
  if (backdrop) backdrop.classList.remove('active');
}

// ═══════════════════════════════════════════════════════════════
//  [TASK-023] 시스템 작업 안내 모달
//  문구는 Index.html이 주입한 SYSTEM_ACTIONS(Config.gs SSOT)에서만 온다 — 시트 대화상자와 같은 문장.
// ═══════════════════════════════════════════════════════════════
function getSystemActionConfig(id) {
  return (typeof SYSTEM_ACTIONS === 'object' && SYSTEM_ACTIONS && SYSTEM_ACTIONS[id]) || null;
}

/** 안내 모달 본문 — 설명 한 단락 + 주의사항 목록 (.action-guide, 시트 대화상자와 같은 마크업) */
function systemActionGuideHtml(action) {
  var items = (action.bullets || []).map(function(b) { return '<li>' + escapeHtml(b) + '</li>'; }).join('');
  return '<div class="action-guide"><p class="desc">' + escapeHtml(action.desc) + '</p>' +
         (items ? '<ul>' + items + '</ul>' : '') + '</div>';
}

/** 안내 모달 푸터 — [취소] + 실행 버튼(작업 정의의 btnClass/btnText). onclick은 호출부가 넘긴다 */
function systemActionFooterHtml(action, submitOnclick, submitId) {
  return '<button class="btn btn-outline" onclick="closeModal()">취소</button>' +
         '<button class="btn ' + escapeHtml(action.btnClass || 'btn-primary') + '"' + (submitId ? ' id="' + submitId + '"' : '') +
         ' onclick="' + submitOnclick + '">' + escapeHtml(action.btnText) + '</button>';
}

// 시트 동기화 — 대시보드·입출고 헤더의 「시트 동기화」 버튼. staff/manager도 누르므로 admin 게이트가 없다.
var _forceRefreshCallback = null;

function openForceRefreshModal(callback) {
  var action = getSystemActionConfig('forceRefresh');
  if (!action) return doForceRefresh(callback); // 정의가 없으면(주입 실패) 예전처럼 바로 실행
  _forceRefreshCallback = callback;
  openModal(action.title, systemActionGuideHtml(action), systemActionFooterHtml(action, 'submitForceRefresh()', 'btnForceRefreshSubmit'));
}

function submitForceRefresh() {
  var callback = _forceRefreshCallback;
  _forceRefreshCallback = null;
  closeModal();
  doForceRefresh(callback);
}

function doForceRefresh(callback) {
  showLoading();
  google.script.run
    .withSuccessHandler(function(r) {
      if (r.success) {
        clearTabData(); // [TASK-027] 서버 캐시를 버렸으니 화면이 들고 있던 탭 데이터도 버린다
        showToast('구글 시트 동기화가 완료되었습니다.', 'success');
        if(typeof callback === 'function') callback();
        else hideLoading();
      } else {
        hideLoading();
        showToast(r.message, 'error');
      }
    })
    .withFailureHandler(function(e) { hideLoading(); showToast('동기화 실패: ' + e.message, 'error'); })
    .forceRefreshData(getToken());
}

// ═══════════════════════════════════════════════════════════════
//  로딩 & 토스트
// ═══════════════════════════════════════════════════════════════
function showLoading() { document.getElementById('loadingOverlay').classList.add('active'); }
function hideLoading() { document.getElementById('loadingOverlay').classList.remove('active'); }

// [TASK-020] Lucide 스프라이트(src/Icons.html) 심볼을 참조하는 <svg class="ico"> 마크업
function iconSvg(name) {
  return '<svg class="ico" aria-hidden="true"><use href="#i-' + name + '"/></svg>';
}

function showToast(message, type) {
  type = type || 'info';
  var container = document.getElementById('toastContainer');
  var icons = { success: 'check-circle-2', error: 'x-circle', warning: 'alert-triangle', info: 'info' };
  var toast = document.createElement('div');
  toast.className = 'toast ' + type;
  var icon = document.createElement('span');
  icon.className = 'toast-icon';
  icon.innerHTML = iconSvg(icons[type] || 'info');
  var text = document.createElement('span');
  text.textContent = String(message || '');
  toast.appendChild(icon);
  toast.appendChild(text);
  container.appendChild(toast);
  setTimeout(function() {
    toast.classList.add('is-leaving');
    setTimeout(function() { toast.remove(); }, 300);
  }, 4000);
}

// ═══════════════════════════════════════════════════════════════
//  모달
// ═══════════════════════════════════════════════════════════════
function openModal(title, bodyHtml, footerHtml) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  // [TASK-022] 푸터 내용이 없으면(업장 선택 모달 등) 회색 띠를 그리지 않는다 (감사 #16)
  var footer = document.getElementById('modalFooter');
  var hasFooter = !!(footerHtml && String(footerHtml).trim());
  footer.innerHTML = hasFooter ? footerHtml : '';
  footer.hidden = !hasFooter;
  document.getElementById('modalOverlay').classList.add('active');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
}


// ═══════════════════════════════════════════════════════════════
//  대시보드
// ═══════════════════════════════════════════════════════════════
function loadDashboard() {
  showLoading();
  google.script.run
    .withSuccessHandler(function(data) {
      hideLoading();
      if (data.success === false) { showToast(data.message, 'error'); return; }
      renderDashboard(data);
    })
    .withFailureHandler(function(err) { hideLoading(); showToast('대시보드 로드 실패: ' + err.message, 'error'); })
    .getDashboardData(getToken());
}

function renderDashboard(data) {
  document.getElementById('dashDate').textContent = '최신 갱신일: ' + data.date;
  document.getElementById('dashSeason').textContent = data.season + ' (×' + data.seasonMultiplier + ')';
  document.getElementById('kpiTotal').textContent = data.kpi.total;
  document.getElementById('kpiRisk').textContent = data.kpi.risk;
  document.getElementById('kpiOrder').textContent = data.kpi.order;
  document.getElementById('kpiNormal').textContent = data.kpi.normal;

  var alertCount = data.kpi.risk + data.kpi.order;
  var badge = document.getElementById('alertBadge');
  badge.textContent = alertCount;
  badge.hidden = !(alertCount > 0);

  var tbody = document.getElementById('alertTableBody');
  if (data.alertItems.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="empty-state"><span class="empty-icon">' + iconSvg('party-popper') + '</span><p>발주 필요 품목이 없습니다</p></td></tr>';
    return;
  }
  // [TASK-020] 열 정렬 — 품목코드 mono · 수치 num · 상태 ctr (UIGuidelines §5)
  var ALERT_CELL_CLASS = ['mono', '', '', 'num', 'num', 'num', 'num'];
  var fragment = document.createDocumentFragment();
  data.alertItems.forEach(function(item) {
    var statusClass = item.status === 'risk' ? 'risk' : 'order';
    var statusText = item.status === 'risk' ? '위험' : '발주필요';
    var tr = document.createElement('tr');
    [item.code, item.name, item.grade, item.currentStock, item.safetyStock, item.rop, item.orderQty].forEach(function(value, index) {
      var td = document.createElement('td');
      if (ALERT_CELL_CLASS[index]) td.className = ALERT_CELL_CLASS[index];
      var node = index === 6 ? document.createElement('strong') : document.createElement('span');
      node.textContent = value == null ? '' : String(value);
      // [TASK-011] 현재고(index 3)가 음수면 초과출고/실사 결손이므로 붉은 pill로 강조
      if (index === 3 && Number(value) < 0) {
        node.className = 'stock-neg';
        node.title = '초과출고 — 재고 실사 조정 필요';
      }
      td.appendChild(node);
      tr.appendChild(td);
    });
    var statusCell = document.createElement('td');
    statusCell.className = 'ctr';
    var badge = document.createElement('span');
    badge.className = 'status-badge ' + statusClass;
    badge.textContent = statusText;
    statusCell.appendChild(badge);
    tr.appendChild(statusCell);
    fragment.appendChild(tr);
  });
  tbody.replaceChildren(fragment);
}

// ═══════════════════════════════════════════════════════════════
//  유틸리티
// ═══════════════════════════════════════════════════════════════
function formatNumber(num) {
  if (num === null || num === undefined || num === '') return '-';
  return Number(num).toLocaleString('ko-KR');
}

function escapeHtml(str) {
  if (!str) return '';
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
