<script>
/**
 * 호텔덕구온천 재고 관리 시스템 v1.0.0 — 클라이언트 JavaScript
 * [MODIFIED] 토큰 기반 인증 + google.script.run 서버 통신
 */

// ═══════════════════════════════════════════════════════════════
//  전역 상태
// ═══════════════════════════════════════════════════════════════
let itemCodeList = [];
let currentShop = '';
let currentUser = null;  // [NEW] { username, name, dept, role }
let authToken = '';      // [NEW] 세션 토큰

// ═══════════════════════════════════════════════════════════════
//  [NEW] 인증 — 로그인 / 로그아웃 / 세션
// ═══════════════════════════════════════════════════════════════

function getToken() { return authToken; }

function submitLogin() {
  var username = document.getElementById('loginUsername').value.trim();
  var password = document.getElementById('loginPassword').value;
  var errEl = document.getElementById('loginError');
  var btn = document.getElementById('loginBtn');

  if (!username || !password) {
    errEl.textContent = '아이디와 비밀번호를 입력해 주세요.';
    return;
  }

  errEl.textContent = '';
  btn.disabled = true;
  btn.textContent = '로그인 중...';

  google.script.run
    .withSuccessHandler(function(result) {
      btn.disabled = false;
      btn.textContent = '로그인';
      if (result.success) {
        authToken = result.token;
        currentUser = result.user;
        sessionStorage.setItem('authToken', result.token);
        sessionStorage.setItem('currentUser', JSON.stringify(result.user));
        onLoginSuccess();
      } else {
        errEl.textContent = result.message;
      }
    })
    .withFailureHandler(function(err) {
      btn.disabled = false;
      btn.textContent = '로그인';
      errEl.textContent = '서버 오류: ' + err.message;
    })
    .login(username, password);
}

function onLoginSuccess() {
  // 로그인 화면 숨기기
  document.getElementById('loginContainer').classList.add('hidden');
  document.getElementById('appContainer').style.display = 'flex';

  // 사이드바 사용자 정보 표시
  var initials = currentUser.name ? currentUser.name.charAt(0) : '?';
  document.getElementById('userAvatar').textContent = initials;
  document.getElementById('userName').textContent = currentUser.name;

  var roleNames = { admin: '관리자', manager: '매니저', staff: '담당자' };
  document.getElementById('userRoleText').textContent = (roleNames[currentUser.role] || currentUser.role) + ' · ' + currentUser.dept;

  // 역할별 UI 분기
  applyRolePermissions();

  // 데이터 로드
  loadDashboard();
  loadShopList();
  loadItemCodes();
}

function applyRolePermissions() {
  var isAdmin = currentUser.role === 'admin';
  var isManager = currentUser.role === 'manager';

  // 설정 탭: admin만 표시 (manager/staff는 숨김)
  // → 설정 탭 자체는 보이지만, CRUD 버튼과 시스템 명령은 admin만
  var adminElements = ['btnAddShop', 'btnAddSeason', 'btnAddUser', 'systemCmdCard',
                       'shopActionCol', 'seasonActionCol', 'userActionCol'];
  adminElements.forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.style.display = isAdmin ? '' : 'none';
  });

  // staff: 품목 등록/수정 버튼 숨기기
  if (currentUser.role === 'staff') {
    var masterActions = document.getElementById('masterActions');
    if (masterActions) masterActions.style.display = 'none';
  }
}

function doLogout() {
  google.script.run
    .withSuccessHandler(function() {})
    .withFailureHandler(function() {})
    .logout(getToken());

  authToken = '';
  currentUser = null;
  sessionStorage.removeItem('authToken');
  sessionStorage.removeItem('currentUser');

  // UI 초기화
  document.getElementById('loginContainer').classList.remove('hidden');
  document.getElementById('appContainer').style.display = 'none';
  document.getElementById('loginUsername').value = '';
  document.getElementById('loginPassword').value = '';
  document.getElementById('loginError').textContent = '';
}

// 페이지 로드 시 세션 복원 시도
document.addEventListener('DOMContentLoaded', function() {
  var savedToken = sessionStorage.getItem('authToken');
  var savedUser = sessionStorage.getItem('currentUser');

  if (savedToken && savedUser) {
    // 서버에서 세션 검증
    google.script.run
      .withSuccessHandler(function(result) {
        if (result.success) {
          authToken = savedToken;
          currentUser = result.user;
          sessionStorage.setItem('currentUser', JSON.stringify(result.user));
          onLoginSuccess();
        } else {
          // 세션 만료 → 로그인 화면
          sessionStorage.removeItem('authToken');
          sessionStorage.removeItem('currentUser');
        }
      })
      .withFailureHandler(function() {
        sessionStorage.removeItem('authToken');
        sessionStorage.removeItem('currentUser');
      })
      .getSessionUser(savedToken);
  }

  // 오늘 날짜 기본값
  var today = new Date().toISOString().split('T')[0];
  var txDate = document.getElementById('txDate');
  if (txDate) txDate.value = today;
});


// ═══════════════════════════════════════════════════════════════
//  네비게이션
// ═══════════════════════════════════════════════════════════════
function showTab(tabId, navEl) {
  document.querySelectorAll('.tab-content').forEach(function(el) { el.classList.remove('active'); });
  document.getElementById('tab-' + tabId).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(function(el) { el.classList.remove('active'); });
  if (navEl) navEl.classList.add('active');

  if (tabId === 'master') loadItemMaster();
  if (tabId === 'settings') loadConfig();

  document.getElementById('sidebar').classList.remove('open');
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

// ═══════════════════════════════════════════════════════════════
//  로딩 & 토스트
// ═══════════════════════════════════════════════════════════════
function showLoading() { document.getElementById('loadingOverlay').classList.add('active'); }
function hideLoading() { document.getElementById('loadingOverlay').classList.remove('active'); }

function showToast(message, type) {
  type = type || 'info';
  var container = document.getElementById('toastContainer');
  var icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
  var toast = document.createElement('div');
  toast.className = 'toast ' + type;
  toast.innerHTML = '<span>' + (icons[type] || '') + '</span><span>' + message + '</span>';
  container.appendChild(toast);
  setTimeout(function() {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(100px)';
    toast.style.transition = 'all 0.3s';
    setTimeout(function() { toast.remove(); }, 300);
  }, 4000);
}

// ═══════════════════════════════════════════════════════════════
//  모달
// ═══════════════════════════════════════════════════════════════
function openModal(title, bodyHtml, footerHtml) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('modalFooter').innerHTML = footerHtml;
  document.getElementById('modalOverlay').classList.add('active');
}

function closeModal(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById('modalOverlay').classList.remove('active');
}


// ═══════════════════════════════════════════════════════════════
//  대시보드
// ═══════════════════════════════════════════════════════════════
function loadDashboard() {
  showLoading();
  google.script.run
    .withSuccessHandler(function(data) {
      hideLoading();
      if (data.success === false) { showToast(data.message, 'error'); return; }
      renderDashboard(data);
    })
    .withFailureHandler(function(err) { hideLoading(); showToast('대시보드 로드 실패: ' + err.message, 'error'); })
    .getDashboardData(getToken());
}

function renderDashboard(data) {
  document.getElementById('dashDate').textContent = '기준일: ' + data.date;
  document.getElementById('dashSeason').textContent = data.season + ' (×' + data.seasonMultiplier + ')';
  document.getElementById('kpiTotal').textContent = data.kpi.total;
  document.getElementById('kpiRisk').textContent = data.kpi.risk;
  document.getElementById('kpiOrder').textContent = data.kpi.order;
  document.getElementById('kpiNormal').textContent = data.kpi.normal;

  var alertCount = data.kpi.risk + data.kpi.order;
  var badge = document.getElementById('alertBadge');
  if (alertCount > 0) { badge.textContent = alertCount; badge.style.display = 'inline'; }
  else { badge.style.display = 'none'; }

  var tbody = document.getElementById('alertTableBody');
  if (data.alertItems.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="empty-state"><span class="empty-icon">🎉</span><p>발주 필요 품목이 없습니다</p></td></tr>';
    return;
  }
  var html = '';
  data.alertItems.forEach(function(item) {
    var statusClass = item.status === 'risk' ? 'risk' : 'order';
    var statusText = item.status === 'risk' ? '🚨 위험' : '⚠️ 발주필요';
    html += '<tr><td><strong>' + item.code + '</strong></td><td>' + item.name + '</td><td>' + item.grade + '</td>' +
      '<td>' + item.currentStock + '</td><td>' + item.safetyStock + '</td><td>' + item.rop + '</td>' +
      '<td><strong>' + item.orderQty + '</strong></td><td><span class="status-badge ' + statusClass + '">' + statusText + '</span></td></tr>';
  });
  tbody.innerHTML = html;
}

// ═══════════════════════════════════════════════════════════════
//  업장 목록 & 품목코드 로드
// ═══════════════════════════════════════════════════════════════
function loadShopList() {
  google.script.run
    .withSuccessHandler(function(shops) {
      var select = document.getElementById('txShopSelect');
      select.innerHTML = '<option value="">업장 선택...</option>';
      shops.forEach(function(shop) {
        var opt = document.createElement('option');
        opt.value = shop.name;
        opt.textContent = shop.name + ' (' + shop.category + ')';
        select.appendChild(opt);
      });
    })
    .withFailureHandler(function() {})
    .getShopList(getToken());
}

function loadItemCodes() {
  google.script.run
    .withSuccessHandler(function(items) { itemCodeList = items || []; })
    .withFailureHandler(function() {})
    .getItemCodes(getToken());
}

// ═══════════════════════════════════════════════════════════════
//  품목코드 자동완성
// ═══════════════════════════════════════════════════════════════
function onItemCodeInput(value) {
  var dropdown = document.getElementById('itemCodeDropdown');
  var nameField = document.getElementById('txItemName');
  if (!value || value.length < 1) { dropdown.style.display = 'none'; nameField.value = ''; return; }

  var query = value.toUpperCase();
  var matches = itemCodeList.filter(function(item) {
    return item.code.toUpperCase().indexOf(query) !== -1 || item.name.indexOf(value) !== -1;
  }).slice(0, 10);

  if (matches.length === 0) { dropdown.style.display = 'none'; nameField.value = ''; return; }

  var html = '';
  matches.forEach(function(item) {
    html += '<div class="autocomplete-item" onclick="selectItemCode(\'' + item.code + '\', \'' + escapeHtml(item.name) + '\')">' +
      '<span class="item-code">' + item.code + '</span><span class="item-name">' + item.name + '</span></div>';
  });
  dropdown.innerHTML = html;
  dropdown.style.display = 'block';

  var exact = itemCodeList.find(function(item) { return item.code === value; });
  if (exact) nameField.value = exact.name;
}

function selectItemCode(code, name) {
  document.getElementById('txItemCode').value = code;
  document.getElementById('txItemName').value = name;
  document.getElementById('itemCodeDropdown').style.display = 'none';
}

document.addEventListener('click', function(e) {
  if (!e.target.closest('.autocomplete-wrapper')) {
    var dd = document.getElementById('itemCodeDropdown');
    if (dd) dd.style.display = 'none';
  }
});

// ═══════════════════════════════════════════════════════════════
//  입출고 기록
// ═══════════════════════════════════════════════════════════════
function loadTransactions() {
  var shopName = document.getElementById('txShopSelect').value;
  currentShop = shopName;
  if (!shopName) return;
  showLoading();
  google.script.run
    .withSuccessHandler(function(records) { hideLoading(); renderTransactions(records); })
    .withFailureHandler(function(err) { hideLoading(); showToast('기록 로드 실패: ' + err.message, 'error'); })
    .getRecentTransactions(getToken(), shopName, 50);
}

function renderTransactions(records) {
  var tbody = document.getElementById('txTableBody');
  document.getElementById('txCount').textContent = records.length + '건';
  if (records.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="empty-state"><span class="empty-icon">📝</span><p>입출고 기록이 없습니다</p></td></tr>';
    return;
  }
  var html = '';
  records.forEach(function(r) {
    var typeClass = r.type === '입고' ? 'color:var(--normal)' : (r.type === '폐기' ? 'color:var(--risk)' : 'color:var(--order)');
    html += '<tr><td>' + r.date + '</td><td><strong>' + r.code + '</strong></td><td>' + r.name + '</td>' +
      '<td style="font-weight:600;' + typeClass + '">' + r.type + '</td><td>' + r.qty + '</td>' +
      '<td>' + (r.person || '-') + '</td><td>' + (r.note || '-') + '</td>' +
      '<td style="font-size:0.75rem;color:var(--text-secondary)">' + (r.txId || '-') + '</td></tr>';
  });
  tbody.innerHTML = html;
}

function saveTransaction() {
  var shopName = document.getElementById('txShopSelect').value;
  if (!shopName) return showToast('업장을 먼저 선택하세요', 'warning');

  var txData = {
    date: document.getElementById('txDate').value,
    code: document.getElementById('txItemCode').value,
    type: document.getElementById('txType').value,
    qty: document.getElementById('txQty').value,
    person: document.getElementById('txPerson').value,
    note: document.getElementById('txNote').value
  };

  if (!txData.date || !txData.code || !txData.type || !txData.qty) return showToast('날짜, 품목코드, 구분, 수량은 필수입니다', 'warning');
  if (Number(txData.qty) <= 0) return showToast('수량은 1 이상이어야 합니다', 'warning');

  showLoading();
  google.script.run
    .withSuccessHandler(function(result) {
      hideLoading();
      if (result.success) {
        showToast(result.message, 'success');
        document.getElementById('txItemCode').value = '';
        document.getElementById('txItemName').value = '';
        document.getElementById('txType').selectedIndex = 0;
        document.getElementById('txQty').value = '';
        document.getElementById('txNote').value = '';
        loadTransactions();
      } else { showToast(result.message, 'error'); }
    })
    .withFailureHandler(function(err) { hideLoading(); showToast('저장 실패: ' + err.message, 'error'); })
    .addTransaction(getToken(), shopName, txData);
}


// ═══════════════════════════════════════════════════════════════
//  품목 마스터
// ═══════════════════════════════════════════════════════════════
function loadItemMaster() {
  showLoading();
  google.script.run
    .withSuccessHandler(function(items) { hideLoading(); renderItemMaster(items); })
    .withFailureHandler(function(err) { hideLoading(); showToast('품목 로드 실패: ' + err.message, 'error'); })
    .getItemMasterData(getToken());
}

function renderItemMaster(items) {
  var tbody = document.getElementById('masterTableBody');
  document.getElementById('masterCount').textContent = items.length + '개';
  if (items.length === 0) {
    tbody.innerHTML = '<tr><td colspan="12" class="empty-state"><span class="empty-icon">🗂️</span><p>등록된 품목이 없습니다</p></td></tr>';
    return;
  }
  var canEdit = currentUser && currentUser.role !== 'staff';
  var html = '';
  items.forEach(function(item) {
    var statusClass = 'normal', statusText = '✅ 정상';
    if (item.status && item.status.indexOf('위험') !== -1) { statusClass = 'risk'; statusText = '🚨 위험'; }
    else if (item.status && item.status.indexOf('발주') !== -1) { statusClass = 'order'; statusText = '⚠️ 발주필요'; }

    html += '<tr><td><strong>' + item.code + '</strong></td><td>' + item.name + '</td><td>' + item.category + '</td>' +
      '<td>' + item.grade + '</td><td>' + item.unit + '</td><td>' + item.currentStock + '</td>' +
      '<td>' + item.dailyUsage + '</td><td>' + item.safetyStock + '</td><td>' + item.rop + '</td>' +
      '<td><span class="status-badge ' + statusClass + '">' + statusText + '</span></td>' +
      '<td class="text-right">' + formatNumber(item.unitPrice) + '</td>';
    if (canEdit) {
      html += '<td><button class="btn btn-outline btn-sm" onclick="openEditItemModal(\'' + item.code + '\')">✏️</button></td>';
    } else {
      html += '<td>-</td>';
    }
    html += '</tr>';
  });
  tbody.innerHTML = html;
}

function openNewItemModal() {
  var body = '<div class="form-grid">' +
    '<div class="form-group"><label>품목코드</label><input type="text" id="newItemCode" placeholder="예: ITM-003"></div>' +
    '<div class="form-group"><label>품목명</label><input type="text" id="newItemName" placeholder="품목명"></div>' +
    '<div class="form-group"><label>카테고리</label><select id="newItemCategory"><option value="">선택...</option></select></div>' +
    '<div class="form-group"><label>ABC 등급</label><select id="newItemGrade"><option value="A">A</option><option value="B">B</option><option value="C">C</option></select></div>' +
    '<div class="form-group"><label>단위</label><input type="text" id="newItemUnit" placeholder="박스, 개, kg..."></div>' +
    '<div class="form-group"><label>초기재고</label><input type="number" id="newItemStock" value="0" min="0"></div>' +
    '<div class="form-group"><label>리드타임(일)</label><input type="number" id="newItemLead" value="3" min="1"></div>' +
    '<div class="form-group"><label>안전재고일수</label><input type="number" id="newItemSafety" value="5" min="1"></div>' +
    '<div class="form-group"><label>목표유지일수</label><input type="number" id="newItemTarget" value="30" min="1"></div>' +
    '<div class="form-group"><label>과세구분</label><select id="newItemTax"><option value="과세">과세</option><option value="비과세">비과세</option></select></div>' +
    '<div class="form-group"><label>매입단가(원)</label><input type="number" id="newItemPrice" value="0" min="0"></div></div>';
  var footer = '<button class="btn btn-outline" onclick="closeModal()">취소</button><button class="btn btn-gold" onclick="submitNewItem()">등록</button>';
  openModal('➕ 신규 품목 등록', body, footer);

  google.script.run.withSuccessHandler(function(config) {
    var catSelect = document.getElementById('newItemCategory');
    if (config && config.categories) {
      config.categories.forEach(function(cat) { var opt = document.createElement('option'); opt.value = cat; opt.textContent = cat; catSelect.appendChild(opt); });
    }
  }).getConfigData(getToken());
}

function submitNewItem() {
  var itemData = {
    code: document.getElementById('newItemCode').value,
    name: document.getElementById('newItemName').value,
    category: document.getElementById('newItemCategory').value,
    grade: document.getElementById('newItemGrade').value,
    unit: document.getElementById('newItemUnit').value,
    initStock: Number(document.getElementById('newItemStock').value),
    leadTime: Number(document.getElementById('newItemLead').value),
    safetyDays: Number(document.getElementById('newItemSafety').value),
    targetDays: Number(document.getElementById('newItemTarget').value),
    taxType: document.getElementById('newItemTax').value,
    unitPrice: Number(document.getElementById('newItemPrice').value)
  };
  if (!itemData.code || !itemData.name) return showToast('품목코드와 품목명은 필수입니다', 'warning');

  showLoading();
  google.script.run
    .withSuccessHandler(function(result) {
      hideLoading();
      if (result.success) { showToast(result.message, 'success'); closeModal(); loadItemMaster(); loadItemCodes(); }
      else { showToast(result.message, 'error'); }
    })
    .withFailureHandler(function(err) { hideLoading(); showToast('등록 실패: ' + err.message, 'error'); })
    .addNewItem(getToken(), itemData);
}

function openEditItemModal(code) {
  showLoading();
  google.script.run
    .withSuccessHandler(function(items) {
      hideLoading();
      var item = items.find(function(i) { return i.code === code; });
      if (!item) return showToast('품목을 찾을 수 없습니다', 'error');

      var body = '<div class="form-grid">' +
        '<div class="form-group"><label>품목코드</label><input type="text" value="' + item.code + '" readonly style="background:#e8f0fb"></div>' +
        '<div class="form-group"><label>품목명</label><input type="text" id="editItemName" value="' + escapeHtml(item.name) + '"></div>' +
        '<div class="form-group"><label>카테고리</label><input type="text" id="editItemCategory" value="' + escapeHtml(item.category) + '"></div>' +
        '<div class="form-group"><label>ABC 등급</label><select id="editItemGrade">' +
          '<option value="A"' + (item.grade==='A'?' selected':'') + '>A</option>' +
          '<option value="B"' + (item.grade==='B'?' selected':'') + '>B</option>' +
          '<option value="C"' + (item.grade==='C'?' selected':'') + '>C</option></select></div>' +
        '<div class="form-group"><label>단위</label><input type="text" id="editItemUnit" value="' + escapeHtml(item.unit) + '"></div>' +
        '<div class="form-group"><label>초기재고</label><input type="number" id="editItemStock" value="' + item.initStock + '"></div>' +
        '<div class="form-group"><label>리드타임(일)</label><input type="number" id="editItemLead" value="' + item.leadTime + '"></div>' +
        '<div class="form-group"><label>안전재고일수</label><input type="number" id="editItemSafety" value="' + item.safetyDays + '"></div>' +
        '<div class="form-group"><label>목표유지일수</label><input type="number" id="editItemTarget" value="' + item.targetDays + '"></div>' +
        '<div class="form-group"><label>과세구분</label><select id="editItemTax">' +
          '<option value="과세"' + (item.taxType==='과세'?' selected':'') + '>과세</option>' +
          '<option value="비과세"' + (item.taxType==='비과세'?' selected':'') + '>비과세</option></select></div>' +
        '<div class="form-group"><label>매입단가(원)</label><input type="number" id="editItemPrice" value="' + item.unitPrice + '"></div></div>';

function loadConfig() {
  showLoading();
  google.script.run
    .withSuccessHandler(function(config) {
      hideLoading();
      if (config.success === false) { showToast(config.message, 'error'); return; }
      renderConfig(config);
    })
    .withFailureHandler(function(err) { hideLoading(); showToast('설정 로드 실패: ' + err.message, 'error'); })
    .getConfigData(getToken());
}

function renderConfig(config) {
  var isAdmin = currentUser && currentUser.role === 'admin';

  // 업장 테이블
  var shopBody = document.getElementById('shopTableBody');
  shopBody.innerHTML = config.shops.map(function(s) {
    var statusStyle = s.status === '생성완료' ? 'color:var(--normal);font-weight:600' : 'color:var(--order)';
    var row = '<tr><td>' + s.category + '</td><td>' + s.name + '</td><td>' + s.tag + '</td><td style="' + statusStyle + '">' + s.status + '</td>';
    if (isAdmin) {
      row += '<td><button class="action-btn delete" onclick="confirmDeleteShop(\'' + escapeHtml(s.name) + '\')" title="삭제">🗑️</button></td>';
    }
    return row + '</tr>';
  }).join('');

  // 시즌 테이블
  var seasonBody = document.getElementById('seasonTableBody');
  seasonBody.innerHTML = config.seasons.map(function(s) {
    var row = '<tr><td>' + s.name + '</td><td>' + s.start + '</td><td>' + s.end + '</td><td>×' + s.multiplier + '</td>';
    if (isAdmin) {
      row += '<td>' +
        '<button class="action-btn edit" onclick="openEditSeasonModal(\'' + escapeHtml(s.name) + '\', \'' + s.start + '\', \'' + s.end + '\', ' + s.multiplier + ')" title="수정">✏️</button> ' +
        '<button class="action-btn delete" onclick="confirmDeleteSeason(\'' + escapeHtml(s.name) + '\')" title="삭제">🗑️</button></td>';
    }
    return row + '</tr>';
  }).join('');

  // 사용자 테이블
  var userBody = document.getElementById('userTableBody');
  userBody.innerHTML = config.users.map(function(u) {
    var roleBadge = '<span class="role-badge ' + u.role + '">' + u.role + '</span>';
    var row = '<tr><td>' + u.username + '</td><td>' + u.name + '</td><td>' + u.dept + '</td><td>' + roleBadge + '</td>';
    if (isAdmin) {
      row += '<td>' +
        '<button class="action-btn edit" onclick="openEditUserModal(\'' + escapeHtml(u.username) + '\', \'' + escapeHtml(u.name) + '\', \'' + escapeHtml(u.dept) + '\', \'' + u.role + '\')" title="수정">✏️</button> ' +
        '<button class="action-btn key" onclick="openResetPasswordModal(\'' + escapeHtml(u.username) + '\')" title="비밀번호 초기화">🔑</button> ' +
        '<button class="action-btn delete" onclick="confirmDeleteUser(\'' + escapeHtml(u.username) + '\')" title="삭제">🗑️</button></td>';
    }
    return row + '</tr>';
  }).join('');
}

function execCommand(command) {
  showLoading();
  google.script.run
    .withSuccessHandler(function(result) {
      hideLoading();
      showToast(result.message, result.success ? 'success' : 'error');
      if (result.success && (command === 'refreshDashboard' || command === 'incrementalSync')) loadDashboard();
      if (result.success && (command === 'generateShops' || command === 'refreshSheetStatus')) loadConfig();
    })
    .withFailureHandler(function(err) { hideLoading(); showToast('명령 실행 실패: ' + err.message, 'error'); })
    .runSystemCommand(getToken(), command);
}


// ═══════════════════════════════════════════════════════════════
//  유틸리티
// ═══════════════════════════════════════════════════════════════
function formatNumber(num) {
  if (num === null || num === undefined || num === '') return '-';
  return Number(num).toLocaleString('ko-KR');
}

function escapeHtml(str) {
  if (!str) return '';
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
